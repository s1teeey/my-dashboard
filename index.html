<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>R1's Dashboard</title>
<meta name="theme-color" content="#8F5CF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="R1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("dash-theme")||"editorial";document.documentElement.dataset.rail=localStorage.getItem("dash-rail")||""}catch(e){}</script>
<style>
/* 電腦：白底、粗標題、細線分隔的編輯式版面（跟新約讀經本同一套）。手機：霧面玻璃卡片 + 底部浮動選單。 */
:root{
  --ink:#121322; --muted:#5E6170; --faint:#9496A3; --line:#E6E5EB; --soft:#F7F6F3;
  --accent:#8F5CF0; --accent-ink:#6E3FD1; --accent-soft:#F1EAFE; --danger:#C8264A; --ok:#0B7A69;
  --on:var(--ink); --on-mute:var(--muted); --on-line:var(--line); --field:var(--soft); --rule:#121322;
  --page:#fff; --card:transparent; --card-pad:0px; --r:0px; --rb:8px; --shadow:none; --hw:900; --hc:var(--ink);
  --h2rule:2px solid var(--rule); --rule-w:3px; --btn-bg:var(--accent); --btn-fg:#fff; --btn-hover:var(--accent-ink); --chip:var(--soft); --nav-on:var(--soft);
  --dur:.16s;
  --f:"Nunito Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.7 var(--f);color:var(--on);background:var(--page);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:20px;height:20px;flex:none}
.solid{background:#fff;color:var(--on)}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}

/* ---- sidebar ---- */
.side{position:sticky;top:0;height:100vh;height:100dvh;padding:20px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:var(--hw);font-size:17px}
.brand img{width:28px;height:28px;border-radius:7px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:none;font-weight:700;color:var(--muted);transition:background var(--dur),color var(--dur)}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav[aria-current=page]{background:var(--nav-on);color:var(--ink);font-weight:var(--hw)}
.nav .ic{width:18px;height:18px}
.nav .pc{color:var(--c)}
.nav .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav small{font-weight:800;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.side h2{font-size:12px;color:var(--faint);padding:18px 10px 6px;font-weight:800}
.side .sp{flex:1}
.sync{font-size:12.5px;color:var(--faint);padding:8px 10px;display:flex;gap:8px;align-items:center;font-weight:700}
.sync i{width:8px;height:8px;border-radius:50%;background:#C9CAD3;flex:none}
.sync.ok i{background:var(--ok)} .sync.bad i{background:var(--danger)} .sync.busy i{background:#C98A0B;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---- main ---- */
main{padding:44px clamp(20px,4vw,56px) 72px;display:flex;flex-direction:column;gap:28px;min-width:0;max-width:1160px;width:100%}
.mast{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:22px;border-bottom:var(--rule-w) solid var(--rule)}
.mast .kick{font-size:13.5px;font-weight:700;color:var(--on-mute)}
.mast h1{color:var(--hc);font-size:40px;font-weight:var(--hw);letter-spacing:-.015em;line-height:1.25}
.stats{display:flex;gap:28px;align-items:flex-end}
.stats div{display:flex;flex-direction:column;line-height:1.2}
.stats b{font-size:28px;font-weight:var(--hw);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:12.5px;font-weight:700;color:var(--on-mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--rb);padding:9px 16px;font-weight:800;font-size:14.5px;color:var(--btn-fg);background:var(--btn-bg);transition:background var(--dur),transform var(--dur);white-space:nowrap}
.btn .ic{width:16px;height:16px}
.btn:hover{background:var(--btn-hover)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--field);color:var(--on)}
.btn.ghost:hover{background:var(--on-line)}
.btn.danger,.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.ib{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--field);color:var(--on);transition:background var(--dur)}
.ib:hover{background:var(--on-line)}
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:start}
.rail{display:grid;gap:36px;align-content:start}
.panel{display:flex;flex-direction:column;min-width:0;background:var(--card);padding:var(--card-pad);border-radius:var(--r);box-shadow:var(--shadow)}
.panel>h2{font-size:15px;font-weight:var(--hw);padding-bottom:10px;border-bottom:var(--h2rule);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.panel>h2 small,.lk{font-size:13px;font-weight:700;color:var(--on-mute)}
.lk{background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:color var(--dur),text-decoration-color var(--dur)}
.lk:hover{color:var(--accent-ink);text-decoration-color:var(--accent)}

/* ---- 進度軌：每段是一個階段，長度＝待辦數，填滿＝完成比例 ---- */
.lane{display:grid;grid-template-columns:42px minmax(150px,230px) minmax(0,1fr) 62px;gap:16px;align-items:center;padding:18px 12px;margin:0 -12px;width:calc(100% + 24px);border:0;border-bottom:1px solid var(--line);background:none;text-align:left;border-radius:8px;transition:background var(--dur)}
.lane:hover{background:var(--soft)}
.lane:hover .nm{color:var(--c)}
.pi{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--cs);color:var(--c);flex:none}
.pi .ic{width:22px;height:22px}
.who{min-width:0}
.who .nm{display:block;font-weight:var(--hw);font-size:16.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color var(--dur)}
.who small{display:block;color:var(--on-mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-size:22px;font-weight:var(--hw);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pct.full{color:var(--c)}
.track{display:flex;gap:4px;min-width:0}
.seg{min-width:0;display:flex;flex-direction:column;gap:5px}
.seg .sn{font-size:12px;font-weight:700;color:var(--on-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg.cur .sn{color:var(--on);font-weight:var(--hw)}
.seg i{display:block;height:8px;border-radius:99px;background:var(--cs);overflow:hidden}
.seg i b{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.track.big .seg i{height:12px}
.track.big .seg .sn{font-size:13.5px}
.seg .sc{font-size:12px;color:var(--on-mute);font-variant-numeric:tabular-nums;font-weight:600}
.track:not(.big) .sc{display:none}

.next{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--on-line)}
.next .ck{margin-top:2px}
.next .t{flex:1;min-width:0}
.next .t b{display:block;font-weight:800;line-height:1.45}
.next .t small{color:var(--on-mute);font-size:12.5px;font-weight:600}
.ck{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:6px;border:2px solid #C9CAD3;margin:0;flex:none;cursor:pointer;display:grid;place-items:center;background:#fff;transition:background var(--dur),border-color var(--dur),transform var(--dur)}
.ck:hover{border-color:var(--c,var(--accent))}
.ck:active{transform:scale(.88)}
.ck:checked{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.ck:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translateY(-1px)}
.row{position:relative;display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--on-line);text-decoration:none;color:var(--on)}
.row:hover b{color:var(--accent-ink)}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:var(--hw);font-size:14px;flex:none;background:var(--field);color:var(--on)}
.row .tt{flex:1;min-width:0}
.row b{display:block;font-weight:800;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color var(--dur)}
.row small{display:block;font-size:12.5px;color:var(--on-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:26px;height:26px;border-radius:50%;border:0;background:none;color:var(--faint);display:grid;place-items:center;flex:none;opacity:0;transition:opacity var(--dur),color var(--dur),background var(--dur)}
.x .ic{width:14px;height:14px}
.x:hover{color:var(--danger);background:var(--field)}
.row:hover .x,.todo:hover .x,.col header:hover .x,.x:focus-visible{opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 32px}

/* ---- project page ---- */
.phead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--card-pad);padding-bottom:max(24px,var(--card-pad));border-bottom:var(--rule-w) solid var(--rule)}
.phead .pi{width:64px;height:64px;border-radius:14px}
.phead .pi .ic{width:32px;height:32px}
.phead h1{color:var(--hc);font-size:34px;font-weight:var(--hw);letter-spacing:-.015em;line-height:1.25}
.phead p{color:var(--on-mute);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:99px;border:1px solid var(--on-line);background:none;font-size:13px;font-weight:800;color:var(--on);text-decoration:none;transition:background var(--dur),border-color var(--dur)}
.pill .ic{width:14px;height:14px}
button.pill:hover,a.pill:hover{background:var(--field);border-color:var(--faint)}
.pill.on{background:var(--cs);border-color:transparent;color:var(--c)}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--cs)} .ring .fg{stroke:var(--c);transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:var(--hw);font-variant-numeric:tabular-nums}
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity}
.col{flex:0 0 290px;padding:12px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;background:var(--soft);border-radius:12px;border:1.5px solid transparent}
.col.cur{border-color:var(--c);background:#fff}
.col header{display:flex;gap:6px;align-items:center}
.board .todo,.board .col>header{-webkit-touch-callout:none}
.dragging{opacity:.45;outline:2px dashed var(--c,var(--accent));outline-offset:-2px}
body.drag,body.drag *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
body.drag .board{scroll-snap-type:none}
.inl{flex:1;min-width:0;border:0;background:none;padding:3px 6px;border-radius:6px;transition:background var(--dur)}
.inl:hover{background:var(--field)}
.inl:focus{outline:0;background:#fff;box-shadow:0 0 0 2px var(--c,var(--accent));color:var(--ink)}
.col header .inl{font-weight:var(--hw);font-size:15px}
.cnt{font-size:12.5px;font-weight:800;color:var(--on-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11.5px;font-weight:var(--hw);padding:1px 8px;border-radius:99px;background:var(--cs);color:var(--c);white-space:nowrap}
.todo{display:flex;gap:8px;align-items:center;padding:7px 6px 7px 10px;border:1px solid var(--line);border-radius:8px}
.todo .inl{font-size:14.5px;font-weight:600}
.todo.done .inl{color:var(--faint);text-decoration:line-through}
.add{border:1.5px dashed #C9CAD3;background:none;border-radius:8px;padding:8px 12px;width:100%;transition:border-color var(--dur),background var(--dur)}
.add::placeholder{color:var(--on-mute)}
.add:focus{outline:0;border-style:solid;border-color:var(--c,var(--accent));background:#fff;color:var(--ink)}
.newcol{flex:0 0 190px;display:flex;gap:6px;align-items:center;justify-content:center;border:1.5px dashed #C9CAD3;background:none;border-radius:12px;padding:16px;font-weight:800;color:var(--on-mute);transition:background var(--dur),color var(--dur)}
.newcol:hover{background:var(--field);color:var(--on)}
.empty{text-align:center;padding:28px 12px;color:var(--on-mute);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .e{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--on-mute)}
.empty b{color:var(--on)}
textarea.note{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;color:var(--ink);resize:vertical;line-height:1.8;margin-top:14px}
textarea.note:focus{outline:0;border-color:var(--c,var(--accent));box-shadow:0 0 0 2px var(--cs,var(--accent-soft))}
.body{display:flex;flex-direction:column;gap:14px;padding-top:16px}

/* ---- forms / modal / toast ---- */
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.lab{font-size:13.5px;font-weight:800}
.in{border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;color:var(--ink);width:100%;transition:border-color var(--dur),box-shadow var(--dur)}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld.err .in{border-color:var(--danger)} .fld .msg{font-size:12.5px;color:var(--on-mute)} .fld.err .msg{color:var(--danger)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--muted);border:2px solid transparent;transition:border-color var(--dur),color var(--dur)}
.pick span.c{background:var(--c);border-radius:50%;width:32px;height:32px;box-shadow:inset 0 0 0 3px #fff}
.pick span.w{width:auto;padding:0 14px;font-size:13.5px;font-weight:800}
.pick input:checked+span{border-color:var(--ink);color:var(--ink)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(18,19,34,.45);display:grid;place-items:center;padding:16px;animation:fade var(--dur)}
.modal{width:min(480px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:#fff;color:var(--ink);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .2s}
.modal h2{font-size:20px;font-weight:var(--hw)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(10px)}}
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);font-weight:700;font-size:14px;animation:pop .2s}
.toast.bad{background:var(--danger)}
.toast button{border:0;background:none;color:#C9B3FF;font-weight:var(--hw);padding:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
pre.code{margin:0;background:var(--ink);color:#E3E4EE;border-radius:10px;padding:14px;font:12px/1.55 ui-monospace,Menlo,monospace;overflow:auto;max-height:220px;white-space:pre}
.acts2{display:flex;flex-wrap:wrap;gap:10px}
.dock,.mback{display:none}
.settings{max-width:720px}

/* ---- 風格 ---- */
html[data-theme=meadow]{--f:"Manrope","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--ink:#141414;--muted:#4C5A4E;--faint:#8A968C;--line:#DCE8D2;--soft:#ECF5DE;
  --accent:#145D24;--accent-ink:#0E4219;--accent-soft:#ECF5DE;--btn-bg:#B2EE61;--btn-fg:#141414;--btn-hover:#9FE043;--rule:#145D24;--rule-w:0px;--h2rule:0;--hc:#145D24;--hw:800;
  --page:radial-gradient(760px 520px at 100% 0,#DCEBFF 0,transparent 62%),radial-gradient(760px 560px at 0 100%,#E4F5CC 0,transparent 62%),#F5FAFF;
  --card:#fff;--card-pad:22px;--r:22px;--rb:99px;--shadow:0 6px 24px rgba(20,93,36,.07);--chip:#fff;--nav-on:#fff}
html[data-theme=voyage]{--f:"Outfit","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--ink:#15161C;--muted:#6F7386;--faint:#A3A7B8;--line:#ECEEF5;--soft:#F1F3FA;
  --accent:#8B7FE8;--accent-ink:#6F62D6;--accent-soft:#ECE9FD;--btn-bg:#111216;--btn-fg:#fff;--btn-hover:#2B2D36;--rule-w:0px;--h2rule:0;--hw:600;
  --page:#EEF1F8;--card:#fff;--card-pad:22px;--r:26px;--rb:99px;--shadow:0 8px 30px rgba(60,70,120,.08);--chip:#fff;--nav-on:#fff}
html:not([data-theme=editorial]) .side{border-right:0}
html:not([data-theme=editorial]) .col{border-radius:18px}
html:not([data-theme=editorial]) .todo,html:not([data-theme=editorial]) .in,html:not([data-theme=editorial]) .add{border-radius:12px}
html[data-theme=voyage] .mast h1,html[data-theme=voyage] .phead h1{letter-spacing:-.01em}
html[data-theme=voyage] .tag,html[data-theme=meadow] .tag{padding:2px 10px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.themes button{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;color:var(--ink);transition:border-color var(--dur)}
.themes button:hover{border-color:var(--faint)}
.themes button[aria-pressed=true]{border-color:var(--ink)}
.themes i{display:flex;gap:4px}
.themes i b{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}

/* ---- 各風格的版面 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pcard{display:grid;grid-template-columns:42px minmax(0,1fr) 64px;gap:16px 12px;align-items:center;text-align:left;padding:20px;border:0;border-radius:var(--r);background:#fff;box-shadow:var(--shadow);transition:transform var(--dur)}
.pcard:hover{transform:translateY(-3px)}
.pcard .ring{width:64px;height:64px}
.pcard .ring b{font-size:15px}
.pcard .track{grid-column:1/-1}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.chipsl{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}
.chipl{display:inline-flex;gap:8px;align-items:center;padding:5px 14px 5px 5px;border-radius:99px;background:var(--soft);text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;transition:background var(--dur)}
.chipl:hover{background:var(--line)}
.chipl .av{border-radius:50%;background:#fff}
.mast.hero{flex-direction:column;align-items:center;text-align:center;gap:18px;padding:28px 0 12px}
.mast.hero h1{font-size:clamp(40px,6vw,64px);line-height:1.1}
.mast.hero .stats{gap:10px;flex-wrap:wrap;justify-content:center}
.mast.hero .stats div{flex-direction:row;gap:8px;align-items:baseline;padding:8px 18px;border-radius:99px;background:#fff;box-shadow:var(--shadow)}
.mast.hero .stats b{font-size:20px}
.railt{display:none}
.pinb.on{opacity:1;color:#C98A0B}
.pinb.on .ic{fill:currentColor}
.strip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:stretch}
.strip .btn{border-radius:22px;padding:0 28px;font-size:15.5px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.tiles3 div{padding:18px 20px;border-radius:22px;background:#E4E0FB}
.tiles3 div:nth-child(2){background:#D5F0EC}
.tiles3 div:nth-child(3){background:#FBE3D6}
.tiles3 b{font-size:34px}
.panel.bare{background:none;box-shadow:none;padding:0;border-radius:0}
.hscroll{display:flex;gap:16px;overflow-x:auto;padding:14px 4px 16px;margin:0 -4px;scroll-snap-type:x proximity}
.ticket{flex:0 0 300px;display:flex;flex-direction:column;gap:16px;text-align:left;padding:20px;border:0;border-radius:24px;background:#fff;box-shadow:var(--shadow);scroll-snap-align:start;transition:transform var(--dur)}
.ticket:hover{transform:translateY(-3px)}
.thead{display:flex;gap:12px;align-items:center;min-width:0}
.route{display:flex;align-items:center;gap:12px}
.route b{font-size:28px;font-weight:var(--hw);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.route i{flex:1;border-top:2px dotted var(--faint)}
.route span{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tfoot{display:flex;align-items:center;gap:12px;justify-content:space-between}
.go{background:var(--btn-bg);color:var(--btn-fg);border-radius:99px;padding:8px 18px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;padding-top:14px}
.btile{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding:14px 8px;border-radius:18px;background:var(--soft);text-decoration:none;color:var(--ink);transition:background var(--dur)}
.btile:hover{background:var(--accent-soft)}
.btile .av{width:40px;height:40px;border-radius:14px;background:#fff}
.btile b{font-size:12.5px;font-weight:600;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:821px){
  html[data-theme=meadow] .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  html[data-theme=meadow] .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;gap:6px;padding:12px clamp(20px,4vw,56px);overflow:visible;background:rgba(245,250,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  html[data-theme=meadow] .side .pn,html[data-theme=meadow] .side h2,html[data-theme=meadow] .side .sync,html[data-theme=meadow] .nav small{display:none}
  html[data-theme=meadow] .brand{padding:0 18px 0 0}
  html[data-theme=meadow] .nav{width:auto;border-radius:99px;padding:8px 16px}
  html[data-theme=meadow] main{margin:0 auto;padding-top:20px}
  html[data-theme=voyage] .app{grid-template-columns:272px minmax(0,1fr)}
  html[data-theme=voyage] main{max-width:none}
  html[data-theme=voyage] .side{top:12px;height:calc(100dvh - 24px);margin:12px 0 12px 12px;padding:16px 12px;gap:4px;background:#fff;border-radius:26px;box-shadow:var(--shadow)}
  html[data-theme=voyage] .railt{display:flex}
  html[data-theme=voyage] .nav{border-radius:14px}
  html[data-theme=voyage] .nav[aria-current=page]{background:#111216;color:#fff}
  html[data-theme=voyage] .nav[aria-current=page] .pc,html[data-theme=voyage] .nav[aria-current=page] small{color:#fff}
  html[data-theme=voyage]:not([data-rail=open]) .app{grid-template-columns:100px minmax(0,1fr)}
  html[data-theme=voyage]:not([data-rail=open]) .side{padding:16px 0;align-items:center;gap:6px}
  html[data-theme=voyage]:not([data-rail=open]) .side .nm,html[data-theme=voyage]:not([data-rail=open]) .side small,html[data-theme=voyage]:not([data-rail=open]) .side h2,html[data-theme=voyage]:not([data-rail=open]) .sync span{display:none}
  html[data-theme=voyage]:not([data-rail=open]) .brand{padding:0 0 10px}
  html[data-theme=voyage]:not([data-rail=open]) .brand img{width:36px;height:36px;border-radius:12px}
  html[data-theme=voyage]:not([data-rail=open]) .nav{width:48px;height:48px;justify-content:center;padding:0;border-radius:16px;flex:none}
  html[data-theme=voyage] .phead{background:var(--cs)}
  html[data-theme=voyage] .phead .pi{background:#fff}
  html[data-theme=voyage] .ring .bg{stroke:#fff}
}

/* ---- 手機版面 ---- */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(112px + env(safe-area-inset-bottom,0px));gap:22px}
  .mast{padding-bottom:16px}
  .mast h1{font-size:34px;line-height:1.2}
  .mast .btn{display:none}
  .stats{width:100%;gap:8px}
  .stats div{flex:1;padding:12px 14px;border-radius:max(12px,var(--r));background:var(--chip);box-shadow:var(--shadow)}
  .stats b{font-size:24px}
  .home{grid-template-columns:minmax(0,1fr);gap:28px}
  .rail{gap:28px}
  html:not([data-theme=editorial]) .panel{padding:16px}
  .lane{grid-template-columns:42px minmax(0,1fr) auto;gap:12px;padding:16px 12px}
  .lane .track{grid-column:1/-1;grid-row:2}
  .phead{grid-template-columns:auto minmax(0,1fr) auto;gap:14px}
  .phead .info{grid-column:1/-1;grid-row:2}
  .phead .ring{grid-column:3;width:76px;height:76px}
  .phead .pi{width:52px;height:52px}
  .phead .pi .ic{width:26px;height:26px}
  .phead h1{font-size:28px}
  .ring b{font-size:18px}
  .board{margin-inline:-16px;padding-inline:16px;scroll-snap-type:x mandatory}
  .col{flex-basis:84vw}
  .inl:hover{background:none}
  .x{opacity:1}
  .grid{grid-template-columns:minmax(0,1fr)}
  .mback{display:flex;justify-content:space-between;align-items:center}
  .mback .ib{width:44px;height:44px;background:var(--chip);box-shadow:var(--shadow)}
  .mback b{font-weight:var(--hw);font-size:16px}
  .dock{display:flex;position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));gap:6px;padding:7px;border-radius:99px;background:rgba(255,255,255,.86);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 12px 32px rgba(18,19,34,.16)}
  .dock button{width:52px;height:52px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center;transition:background var(--dur),color var(--dur),transform var(--dur)}
  .dock .ic{width:22px;height:22px}
  .toasts{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .duo{grid-template-columns:minmax(0,1fr)}
  .mast.hero{padding-top:8px}
  .tiles3{gap:8px}
  .strip{grid-template-columns:minmax(0,1fr)}
  .strip .btn{display:none}
  .tiles3 div{padding:14px;box-shadow:none}
  .tiles3 b{font-size:26px}
  .ticket{flex-basis:78vw}
  .dock button:active{transform:scale(.9)}
  .dock button[aria-current=page]{background:var(--btn-bg);color:var(--btn-fg)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main"></aside>
  <main id="main"></main>
</div>
<nav class="dock" id="dock" aria-label="Main"></nav>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="seed.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const LS='dash-v1',LSC='dash-sync';
/* 顏色：[主色, 淺底] */
const COLORS=[['#8F5CF0','#F1EAFE'],['#0B7A69','#E0F3EF'],['#C8264A','#FBE8ED'],['#946000','#FBF1DA'],['#2563C9','#E6EEFB'],['#B8410E','#FBEDE5'],['#4B5568','#ECEEF2'],['#2F7D32','#E6F3E6']];
const ICONS={
 grip:'<path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="2.6"/>',
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
 settings:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>', back:'<path d="M15 18l-6-6 6-6"/>', out:'<path d="M7 17 17 7M9 7h8v8"/>',
 pen:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 book:'<path d="M12 7v13"/><path d="M3 5h6a3 3 0 0 1 3 3 3 3 0 0 1 3-3h6v13h-6a3 3 0 0 0-3 2 3 3 0 0 0-3-2H3z"/>',
 cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/>',
 flag:'<path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.500-6s6.500 2.500 6.500 6"/><path d="M16 4.600a3.500 3.500 0 0 1 0 6.800M18.500 14.500c1.800.9 3 2.900 3 5.500"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-7 8-7s8 3 8 7"/>',
 layout:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
 palette:'<path d="M12 3a9 9 0 1 0 0 18c1.500 0 2-1 2-2 0-1.500 1-2 2-2h2a3 3 0 0 0 3-3c0-5-4-9-9-9z"/><circle cx="7.500" cy="11.500" r="1"/><circle cx="10.500" cy="7.500" r="1"/><circle cx="15" cy="8" r="1"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.500 3 14.500 0 18M12 3c-3 3.500-3 14.500 0 18"/>',
 code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',
 bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.500c.7.700 1 1.500 1 2.500h6c0-1 .3-1.800 1-2.500A6 6 0 0 0 12 3z"/>',
 send:'<path d="M21 3 10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>',
 star:'<path d="M12 3l2.700 5.600 6.100.9-4.400 4.300 1 6.100L12 17l-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z"/>',
 heart:'<path d="M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/>',
 cup:'<path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h1.500a2.500 2.500 0 0 1 0 5H17M8 3v2M12 3v2"/>'};
const PICK=['book','cap','flag','users','user','layout','palette','globe','code','bulb','send','star','heart','pen'];
const ic=k=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[k]||ICONS.star)+'</svg>';
const TEMPLATES={one:['待辦'],web:['構想','製作','上線'],learn:['入門','練習','做作品']};
const T=(text,done)=>({id:uid(),text,done:!!done});

function seed(){const src=window.SEED||{p:[],l:[]};
  return {v:3,updatedAt:0,
   projects:src.p.map(([name,icon,color,desc,link,st])=>({id:uid(),name,icon,color,desc,link,notes:'',stages:st.map(([n,ts])=>({id:uid(),name:n,todos:ts.map(([t,d])=>T(t,d))}))})),
   links:src.l.map(([title,url,group])=>({id:uid(),title,url,group}))}}

let S;try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
if(!S||!S.projects||S.example===true) S=seed();
S.projects.forEach(p=>{if(!p.icon)p.icon='star'});
if(S.v!==3){seed().projects.forEach(p=>{if(!S.projects.some(q=>q.name===p.name))S.projects.push(p)});S.v=3;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
if(!S.links.some(l=>'pin' in l))S.links.forEach((l,i)=>{l.pin=i<6});
let CFG={url:'',token:''};try{CFG=Object.assign(CFG,JSON.parse(localStorage.getItem(LSC)||'{}'))}catch(e){}
let syncState=CFG.url?'idle':'off',syncAt=0,syncTimer=null;

function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Save failed: storage unavailable','bad')}}
function save(){S.updatedAt=Date.now();persist();if(CFG.url){clearTimeout(syncTimer);syncTimer=setTimeout(push,1500)}}

/* ---- stats ---- */
const pstat=p=>{let t=0,d=0;p.stages.forEach(s=>{t+=s.todos.length;d+=s.todos.filter(x=>x.done).length});return {t,d,pct:t?Math.round(d/t*100):0}};
const curStage=p=>p.stages.find(s=>s.todos.some(x=>!x.done))||null;
const nextTodo=p=>{const s=curStage(p);return s?{s,t:s.todos.find(x=>!x.done)}:null};
const cvar=p=>{const c=COLORS[p.color%COLORS.length];return `--c:${c[0]};--cs:${c[1]}`};
const P=id=>S.projects.find(p=>p.id===id);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};

function track(p,big){
  if(!p.stages.length) return '<div class="cnt">No stages</div>';
  const cur=curStage(p);
  return `<div class="track${big?' big':''}">${p.stages.map(s=>{const t=s.todos.length,d=s.todos.filter(x=>x.done).length;
    return `<div class="seg${s===cur?' cur':''}" style="flex:${Math.max(1,t)}" title="${esc(s.name)} ${d}/${t}"><span class="sn">${esc(s.name)}</span><i><b style="width:${t?d/t*100:0}%"></b></i><span class="sc">${d}/${t}</span></div>`}).join('')}</div>`}

/* ---- routing ---- */
const route=()=>{const h=location.hash.replace(/^#\/?/,'');const m=h.match(/^p\/(.+)$/);if(m&&P(m[1]))return {v:'project',id:m[1]};return {v:['links','settings'].includes(h)?h:'home'}};
const go=h=>{location.hash='#/'+h};
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---- views ---- */
const TH=()=>document.documentElement.dataset.theme||'editorial';
function renderSide(){const r=route();
  const cur=(v,id)=>r.v===v&&(id==null||r.id===id)?' aria-current="page"':'';
  $('#side').innerHTML=`<div class="brand"><img src="icon-192.png" alt=""><span class="nm">R1's Dashboard</span></div>
   <button class="nav railt" data-act="rail" title="Toggle Sidebar">${ic('panel')}<span class="nm">Collapse</span></button>
   <button class="nav" data-go=""${cur('home')} title="Home">${ic('home')}<span class="nm">Home</span></button>
   <button class="nav" data-go="links"${cur('links')} title="Bookmarks">${ic('bookmark')}<span class="nm">Bookmarks</span><small>${S.links.length}</small></button>
   <h2>Projects</h2>
   ${S.projects.map(p=>`<button class="nav pn" data-go="p/${p.id}"${cur('project',p.id)} style="${cvar(p)}" title="${esc(p.name)}"><span class="pc" style="display:grid">${ic(p.icon)}</span><span class="nm">${esc(p.name)}</span><small>${pstat(p).pct}%</small></button>`).join('')}
   <button class="nav pn" data-act="newProject" title="New Project">${ic('plus')}<span class="nm">New Project</span></button>
   <div class="sp"></div>
   ${syncState!=='off'?`<div class="sync ${({ok:'ok',bad:'bad',busy:'busy'})[syncState]||''}"><i></i><span>${syncLabel()}</span></div>`:''}
   <button class="nav" data-go="settings"${cur('settings')} title="Settings">${ic('settings')}<span class="nm">Settings</span></button>`;
  $('#dock').innerHTML=`<button data-go=""${cur('home')} aria-label="Home">${ic('home')}</button><button data-go="links"${cur('links')} aria-label="Bookmarks">${ic('bookmark')}</button><button data-act="newProject" aria-label="New Project">${ic('plus')}</button><button data-go="settings"${cur('settings')} aria-label="Settings">${ic('settings')}</button>`}
function syncLabel(){return {off:'',idle:'Sync on',busy:'Syncing',ok:'Synced '+new Date(syncAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),bad:'Sync failed'}[syncState]}
const emptyBox=(icon,title,btn)=>`<div class="empty"><div class="e">${ic(icon)}</div><b>${title}</b>${btn||''}</div>`;
const ring=(p,st)=>{const C=2*Math.PI*42;return `<span class="ring"><svg viewBox="0 0 96 96" width="100%" height="100%"><circle class="bg" cx="48" cy="48" r="42"/><circle class="fg" cx="48" cy="48" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-st.pct/100)}"/></svg><b>${st.pct}%</b></span>`};
const nextText=(p,st)=>{const n=nextTodo(p);return n?'Next: '+esc(n.t.text):st.t?'Completed':'No tasks'};

function viewHome(){
  const hl=S.links.filter(l=>l.pin).slice(0,S.homeLinks||6),th=TH(),all=S.projects.map(pstat),t=all.reduce((a,x)=>a+x.t,0),d=all.reduce((a,x)=>a+x.d,0);
  const today=new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  const nexts=S.projects.map(p=>({p,n:nextTodo(p)})).filter(x=>x.n);
  const stats=`<div class="stats"><div><b>${S.projects.length}</b><span>Projects</span></div><div><b>${t-d}</b><span>Open Tasks</span></div><div><b>${d}</b><span>Completed Tasks</span></div></div>`;
  const newBtn=`<button class="btn" data-act="newProject">${ic('plus')}New Project</button>`;
  const noProj=emptyBox('layout','No projects',newBtn);
  const nextPanel=`<section class="panel"><h2>Next Steps</h2>
     ${nexts.length?nexts.map(({p,n})=>`<div class="next" style="${cvar(p)}"><input type="checkbox" class="ck" data-act="toggle" data-p="${p.id}" data-s="${n.s.id}" data-t="${n.t.id}" aria-label="Complete ${esc(n.t.text)}"><div class="t"><b>${esc(n.t.text)}</b><small>${esc(p.name)} · ${esc(n.s.name)}</small></div></div>`).join(''):emptyBox('cup','All clear')}</section>`;
  const bmHead=`<h2>Bookmarks <button class="lk" data-go="links">All ${S.links.length}</button></h2>`;
  const noBm=emptyBox('bookmark','No pinned bookmarks',`<button class="btn sm ghost" data-go="links">Manage</button>`);
  if(th==='meadow') return `<header class="mast hero"><p class="kick">${today}</p><h1>Projects</h1>${stats}${newBtn}</header>
   ${S.projects.length?`<section class="cards">${S.projects.map(p=>{const st=pstat(p);return `<button class="pcard" data-go="p/${p.id}" style="${cvar(p)}"><span class="pi">${ic(p.icon)}</span><span class="who"><span class="nm">${esc(p.name)}</span><small>${nextText(p,st)}</small></span>${ring(p,st)}${track(p)}</button>`}).join('')}</section>`:`<section class="panel">${noProj}</section>`}
   <div class="duo">${nextPanel}<section class="panel">${bmHead}${hl.length?`<div class="chipsl">${hl.map(l=>`<a class="chipl" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="av">${esc(mark(l))}</span>${esc(l.title)}</a>`).join('')}</div>`:noBm}</section></div>`;
  if(th==='voyage') return `<header class="mast"><div><p class="kick">${today}</p><h1>Projects</h1></div></header>
   <div class="strip">${stats.replace('class="stats"','class="stats tiles3"')}${newBtn}</div>

function scriptCode(tok){return `const TOKEN = '${(tok||'在這裡填同步密碼').replace(/['\\\\]/g,'')}';
const FILE = 'my-dashboard-data.json';

function doPost(e) {
  const out = o => ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
  let b;
  try { b = JSON.parse(e.postData.contents); } catch (err) { return out({ ok: false, error: 'bad request' }); }
  if (b.token !== TOKEN) return out({ ok: false, error: 'unauthorized' });
  const it = DriveApp.getFilesByName(FILE);
  const f = it.hasNext() ? it.next() : null;
  if (b.action === 'get') {
    if (!f) return out({ ok: true, updatedAt: 0, data: null });
    const j = JSON.parse(f.getBlob().getDataAsString());
    return out({ ok: true, updatedAt: j.updatedAt || 0, data: j });
  }
  if (b.action === 'set') {
    const lock = LockService.getScriptLock();
    lock.waitLock(10000);
    try {
      const txt = JSON.stringify(b.data);
      if (f) f.setContent(txt); else DriveApp.createFile(FILE, txt, 'application/json');
    } finally { lock.releaseLock(); }
    return out({ ok: true });
  }
  return out({ ok: false, error: 'unknown action' });
}`}

/* ---- sync（Google Apps Script，後寫的蓋掉先寫的） ---- */
async function api(body){const r=await fetch(CFG.url,{method:'POST',body:JSON.stringify(Object.assign({token:CFG.token},body))});const j=await r.json();if(!j.ok)throw new Error(j.error||'sync error');return j}
function setSync(st){syncState=st;if(st==='ok')syncAt=Date.now();renderSide();const t=$('#synclab');if(t)t.textContent=syncLabel()}
async function push(){if(!CFG.url)return;setSync('busy');try{await api({action:'set',data:S});setSync('ok')}catch(e){setSync('bad')}}
async function pull(loud){if(!CFG.url)return;setSync('busy');
  try{const j=await api({action:'get'});
    if(j.data&&j.updatedAt>S.updatedAt){S=j.data;S.projects.forEach(p=>{if(!p.icon)p.icon='star'});persist();setSync('ok');render();loud&&toast('Loaded newer data')}
    else if(S.updatedAt>(j.updatedAt||0)||!j.data){await api({action:'set',data:S});setSync('ok');if(loud){render();toast('Synced')}}
    else{setSync('ok');if(loud){render();toast('Synced')}}
  }catch(e){setSync('bad');if(loud){render();toast(e.message==='unauthorized'?'Passphrase mismatch':'Cannot reach sync URL','bad')}}}
/* 拖曳排序：階段左右換位，待辦上下移動（可跨階段） */
let DG=null,PD=null,swallow=false;
function dragStart(){const {kind,el,board}=PD;clearTimeout(PD.timer);PD=null;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();try{getSelection().removeAllRanges()}catch(e){}
  DG={kind,el,board};el.classList.add('dragging');document.body.classList.add('drag')}
document.addEventListener('pointerdown',e=>{if(e.button>0||DG)return;const t=e.target;
  if(t.closest('button,.add')||t===document.activeElement&&t.matches('input.inl'))return;
  const todo=t.closest('.board .todo'),head=t.closest('.board .col>header');if(!todo&&!head)return;
  PD={kind:todo?'todo':'col',el:todo||head.parentNode,board:t.closest('.board'),x:e.clientX,y:e.clientY,touch:e.pointerType==='touch'};
  if(PD.touch)PD.timer=setTimeout(()=>{if(PD){dragStart();if(navigator.vibrate)navigator.vibrate(10)}},380)});
document.addEventListener('pointermove',e=>{if(!PD)return;const far=Math.hypot(e.clientX-PD.x,e.clientY-PD.y)>6;
  if(!far)return;if(PD.touch){clearTimeout(PD.timer);PD=null}else dragStart()},true);
document.addEventListener('touchmove',e=>{if(DG)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(DG)e.preventDefault()});
document.addEventListener('click',e=>{if(swallow){e.preventDefault();e.stopPropagation();swallow=false}},true);
document.addEventListener('pointermove',e=>{if(!DG)return;const {kind,el,board}=DG;
  const br=board.getBoundingClientRect();if(e.clientX>br.right-50)board.scrollLeft+=14;else if(e.clientX<br.left+50)board.scrollLeft-=14;
  const cols=[...board.querySelectorAll('.col')];
  const col=cols.find(c=>{const r=c.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right});
  if(kind==='col'){if(!col||col===el)return;const after=cols.indexOf(col)>cols.indexOf(el);board.insertBefore(el,after?col.nextElementSibling:col);return}
  if(!col)return;const add=col.querySelector('.add');
  const ts=[...col.querySelectorAll('.todo')].filter(t=>t!==el);
  const before=ts.find(t=>{const r=t.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  const ref=before||add;if(el.nextElementSibling!==ref||el.parentNode!==col)col.insertBefore(el,ref)});
function dragEnd(){if(PD){clearTimeout(PD.timer);PD=null}if(!DG)return;swallow=true;setTimeout(()=>swallow=false,0);const {el,board}=DG;DG=null;el.classList.remove('dragging');document.body.classList.remove('drag');
  const p=S.projects.find(x=>x.id===board.dataset.p);if(!p){render();return}
  const all={};p.stages.forEach(s=>s.todos.forEach(t=>all[t.id]=t));const sm={};p.stages.forEach(s=>sm[s.id]=s);
  const before=JSON.stringify(p.stages.map(s=>[s.id,s.todos.map(t=>t.id)]));
  const ns=[...board.querySelectorAll('.col')].map(c=>{const s=sm[c.dataset.s];if(s)s.todos=[...c.querySelectorAll('.todo')].map(t=>all[t.dataset.t]).filter(Boolean);return s}).filter(Boolean);
  if(ns.length===p.stages.length)p.stages=ns;
  if(JSON.stringify(p.stages.map(s=>[s.id,s.todos.map(t=>t.id)]))!==before)save();
  const sl=board.scrollLeft;render();const b=document.querySelector('.board');if(b)b.scrollLeft=sl}
document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});

render();pull();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
