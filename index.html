<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的工作台</title>
<meta name="theme-color" content="#5b4bf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* 電腦：左側選單 + 內容區的工作台。手機：霧面玻璃卡片 + 底部浮動選單。 */
:root{
  --ink:#161a2b; --mute:#687089; --accent:#5b4bf0; --accent2:#8f6bff; --danger:#d8433b; --ok:#1f9d61;
  --on:#161a2b; --on-mute:#687089; --line:rgba(22,26,43,.1);
  --glass:rgba(255,255,255,.74); --glass-b:rgba(255,255,255,.95); --field:rgba(22,26,43,.05);
  --r:20px; --dur:.18s;
  --f:"Plus Jakarta Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.6 var(--f);color:var(--on);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 600px at 8% 0%,#ddd6ff 0,transparent 60%),radial-gradient(800px 560px at 95% 8%,#cdeaff 0,transparent 60%),radial-gradient(900px 600px at 70% 105%,#ffe0d0 0,transparent 60%),#eef0f8;background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}
.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--r);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 10px 40px rgba(40,50,90,.08)}
.solid{background:#fff;color:var(--ink);border-radius:16px;box-shadow:0 2px 10px rgba(40,50,90,.07)}

/* ---- sidebar ---- */
.side{position:sticky;top:0;height:100vh;height:100dvh;padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;border-right:1px solid var(--line);background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:800;font-size:17px}
.brand img{width:34px;height:34px;border-radius:10px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:0;border-radius:12px;background:none;font-weight:600;color:var(--mute);transition:background var(--dur),color var(--dur)}
.nav:hover{background:rgba(22,26,43,.06);color:var(--ink)}
.nav[aria-current=page]{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(40,50,90,.08)}
.nav .dot{width:10px;height:10px;border-radius:50%;flex:none}
.nav span.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav small{font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.side h2{font-size:11.5px;letter-spacing:.1em;color:var(--mute);padding:16px 12px 6px;font-weight:700}
.side .sp{flex:1}
.sync{font-size:12px;color:var(--mute);padding:8px 12px;display:flex;gap:8px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:#b6bccd;flex:none}
.sync.ok i{background:var(--ok)} .sync.bad i{background:var(--danger)} .sync.busy i{background:#e0a21a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---- main ---- */
main{padding:28px clamp(16px,3vw,40px) 60px;display:flex;flex-direction:column;gap:22px;min-width:0;max-width:1320px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.top p{color:var(--on-mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(91,75,240,.3);transition:transform var(--dur),filter var(--dur),box-shadow var(--dur);white-space:nowrap}
.btn:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(91,75,240,.38)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--field);color:var(--on);box-shadow:none}
.btn.ghost:hover{background:rgba(22,26,43,.1);filter:none}
.btn.danger{background:var(--danger);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.ib{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--field);color:var(--on);transition:background var(--dur)}
.ib:hover{background:rgba(22,26,43,.12)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 18px;display:flex;flex-direction:column;min-width:120px}
.chip b{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.chip span{font-size:12.5px;color:var(--on-mute);font-weight:600}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:14px;background:rgba(91,75,240,.1);border:1px solid rgba(91,75,240,.25);font-size:14px}
.panel{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.panel>h2{font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel>h2 small{font-size:12.5px;font-weight:600;color:var(--on-mute)}

/* ---- progress lanes（沒有日期的甘特圖：每段是一個階段，長度＝待辦數，填滿＝完成比例） ---- */
.lane{display:grid;grid-template-columns:210px minmax(0,1fr) 58px;gap:16px;align-items:center;padding:12px;border-radius:16px;border:0;background:none;width:100%;text-align:left;transition:background var(--dur),transform var(--dur)}
.lane:hover{background:rgba(255,255,255,.7);transform:translateX(3px)}
.lane .who{display:flex;gap:12px;align-items:center;min-width:0}
.emo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 14px color-mix(in srgb,var(--c1) 35%,transparent)}
.who b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;color:var(--on-mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-size:19px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.track{display:flex;gap:5px;min-width:0}
.seg{min-width:0;display:flex;flex-direction:column;gap:5px}
.seg .sn{font-size:11.5px;font-weight:700;color:var(--on-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg.cur .sn{color:var(--on)}
.seg i{display:block;height:12px;border-radius:999px;background:color-mix(in srgb,var(--c1) 16%,rgba(255,255,255,.6));overflow:hidden;position:relative}
.seg i b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .4s cubic-bezier(.2,.8,.2,1)}
.seg.cur i{box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 40%,transparent)}
.track.big .seg i{height:18px}
.track.big .seg .sn{font-size:13px}
.seg .sc{font-size:11px;color:var(--on-mute);font-variant-numeric:tabular-nums}
.track:not(.big) .sc{display:none}

.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
.next{display:flex;gap:12px;align-items:center;padding:11px 14px}
.next .t{flex:1;min-width:0}
.next .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next .t small{color:var(--mute);font-size:12.5px}
.ck{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid color-mix(in srgb,var(--c1,var(--accent)) 55%,#c8cce0);margin:0;flex:none;cursor:pointer;display:grid;place-items:center;transition:background var(--dur),border-color var(--dur),transform var(--dur);background:#fff}
.ck:hover{border-color:var(--c1,var(--accent))}
.ck:active{transform:scale(.88)}
.ck:checked{background:var(--c1,var(--accent));border-color:var(--c1,var(--accent))}
.ck:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translateY(-1px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;gap:10px;align-items:center;padding:11px 12px;text-decoration:none;color:var(--ink);transition:transform var(--dur),box-shadow var(--dur)}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(40,50,90,.14)}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.tile .tt{min-width:0}
.tile b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{display:block;font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .x{position:absolute;top:-6px;right:-6px;opacity:0}
.tile:hover .x,.tile .x:focus-visible{opacity:1}
.x{width:22px;height:22px;border-radius:50%;border:0;background:#fff;color:var(--mute);box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center;font-size:12px;line-height:1;transition:opacity var(--dur),color var(--dur)}
.x:hover{color:var(--danger)}

/* ---- project page ---- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px 28px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;box-shadow:0 18px 44px color-mix(in srgb,var(--c1) 38%,transparent)}
.hero::before{content:"";position:absolute;width:340px;height:340px;right:-90px;top:-150px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero::after{content:"";position:absolute;width:200px;height:200px;right:120px;bottom:-130px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero>*{position:relative;z-index:1}
.hero .big{font-size:44px;line-height:1}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:10px}
.hero p{opacity:.92;max-width:60ch}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);font-size:13px;font-weight:700;color:#fff;text-decoration:none;transition:background var(--dur)}
button.pill:hover,a.pill:hover{background:rgba(255,255,255,.36)}
.ring{position:relative;width:118px;height:118px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.26)} .ring .fg{stroke:#fff;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.col{flex:0 0 290px;padding:14px;display:flex;flex-direction:column;gap:9px;scroll-snap-align:start}
.col.cur{box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 55%,transparent),0 10px 30px rgba(40,50,90,.1)}
.col header{display:flex;gap:8px;align-items:center}
.inl{flex:1;min-width:0;border:0;background:none;padding:4px 6px;border-radius:8px;transition:background var(--dur)}
.inl:hover{background:var(--field)}
.inl:focus{outline:0;background:#fff;box-shadow:0 0 0 2px var(--c1,var(--accent));color:var(--ink)}
.col header .inl{font-weight:800;font-size:15px}
.cnt{font-size:12px;font-weight:700;color:var(--on-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--c1);color:#fff;white-space:nowrap}
.todo{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 10px;position:relative}
.todo .inl{font-size:14px}
.todo.done .inl{color:var(--mute);text-decoration:line-through}
.todo .x{position:static;box-shadow:none;background:none;opacity:0;flex:none}
.todo:hover .x,.todo .x:focus-visible{opacity:1}
.add{border:1.5px dashed color-mix(in srgb,var(--on) 28%,transparent);background:none;border-radius:12px;padding:9px 12px;width:100%;transition:border-color var(--dur),background var(--dur)}
.add::placeholder{color:var(--on-mute)}
.add:focus{outline:0;border-style:solid;border-color:var(--c1,var(--accent));background:#fff;color:var(--ink)}
.newcol{flex:0 0 200px;border:1.5px dashed color-mix(in srgb,var(--on) 28%,transparent);background:none;border-radius:var(--r);padding:18px;font-weight:700;color:var(--on-mute);transition:background var(--dur),color var(--dur)}
.newcol:hover{background:var(--glass);color:var(--on)}
.empty{text-align:center;padding:26px 12px;color:var(--on-mute);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .e{font-size:34px}
textarea.note{width:100%;min-height:120px;border:0;border-radius:14px;padding:14px;background:#fff;color:var(--ink);resize:vertical;line-height:1.7}
textarea.note:focus{outline:0;box-shadow:0 0 0 2px var(--c1,var(--accent))}

/* ---- forms / modal / toast ---- */
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.lab{font-size:13px;font-weight:700}
.in{border:1.5px solid rgba(22,26,43,.14);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);width:100%;transition:border-color var(--dur),box-shadow var(--dur)}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,75,240,.2)}
.fld.err .in{border-color:var(--danger)} .fld .msg{font-size:12.5px;color:var(--mute)} .fld.err .msg{color:var(--danger)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-size:19px;background:rgba(22,26,43,.06);border:2px solid transparent;transition:transform var(--dur),border-color var(--dur)}
.pick span.c{background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:50%}
.pick span.w{width:auto;padding:0 14px;font-size:13.5px;font-weight:700}
.pick input:checked+span{border-color:var(--ink);transform:scale(1.08)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(14,18,34,.45);display:grid;place-items:center;padding:16px;animation:fade var(--dur)}
.modal{width:min(480px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:#fff;color:var(--ink);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal h2{font-size:20px;font-weight:800}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal .btn.ghost{background:rgba(22,26,43,.06);color:var(--ink)}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}}
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{display:flex;gap:14px;align-items:center;background:#161a2b;color:#fff;padding:11px 16px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);font-weight:600;font-size:14px;animation:pop .22s}
.toast.bad{background:var(--danger)}
.toast button{border:0;background:none;color:#b9b0ff;font-weight:800;padding:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
pre.code{margin:0;background:#161a2b;color:#dfe3f5;border-radius:14px;padding:14px;font:12px/1.55 ui-monospace,Menlo,monospace;overflow:auto;max-height:220px;white-space:pre}
.dock,.mback{display:none}

/* ---- 手機：霧面玻璃 ---- */
@media (max-width:820px){
  :root{--on:#fff;--on-mute:rgba(255,255,255,.8);--line:rgba(255,255,255,.2);--glass:rgba(255,255,255,.15);--glass-b:rgba(255,255,255,.3);--field:rgba(255,255,255,.18)}
  body{background:radial-gradient(520px 380px at 85% -5%,rgba(255,214,190,.55) 0,transparent 65%),linear-gradient(170deg,#7d95b2 0%,#526a89 34%,#35465f 68%,#222d42 100%);background-attachment:fixed}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px));gap:18px}
  .glass{box-shadow:0 12px 34px rgba(10,16,30,.22)}
  .top h1{font-size:38px;font-style:italic;font-weight:800;line-height:1.08;letter-spacing:-.03em}
  .top .btn{display:none}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{min-width:0;padding:12px}
  .chip b{font-size:22px}
  .lane{grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px;background:#fff;color:var(--ink);box-shadow:0 8px 22px rgba(10,16,30,.18);--on:#161a2b;--on-mute:#687089}
  .lane:hover{background:#fff;transform:none}
  .lane .track{grid-column:1/-1;grid-row:2}
  .panel{padding:16px;gap:12px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px;border-radius:28px}
  .hero h1{font-size:32px;font-style:italic}
  .ring{width:92px;height:92px;position:absolute;right:18px;top:18px}
  .ring b{font-size:20px}
  .board{margin-inline:-16px;padding-inline:16px;scroll-snap-type:x mandatory}
  .col{flex-basis:84vw}
  .col.glass{background:rgba(255,255,255,.2)}
  .inl:hover{background:none}
  .todo .x,.tile .x{opacity:1}
  .btn.ghost:hover,.ib:hover{background:rgba(255,255,255,.3)}
  .banner{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35)}
  .mback{display:flex;justify-content:space-between;align-items:center}
  .mback .ib{width:44px;height:44px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-b);font-size:18px}
  .mback b{font-style:italic;font-weight:800;font-size:17px}
  .dock{display:flex;position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));gap:6px;padding:7px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.36);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 14px 34px rgba(8,12,24,.35)}
  .dock button{width:52px;height:52px;border-radius:50%;border:0;background:none;color:#fff;font-size:21px;display:grid;place-items:center;transition:background var(--dur),color var(--dur),transform var(--dur)}
  .dock button:active{transform:scale(.9)}
  .dock button[aria-current=page]{background:#fff;color:#27354e}
  .settings .in,.settings pre{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="主選單"></aside>
  <main id="main"></main>
</div>
<nav class="dock" id="dock" aria-label="主選單"></nav>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const LS='dash-v1',LSC='dash-sync';

/* ---- stats ---- */
const pstat=p=>{let t=0,d=0;p.stages.forEach(s=>{t+=s.todos.length;d+=s.todos.filter(x=>x.done).length});return {t,d,pct:t?Math.round(d/t*100):0}};
const curStage=p=>p.stages.find(s=>s.todos.some(x=>!x.done))||null;
const nextTodo=p=>{const s=curStage(p);return s?{s,t:s.todos.find(x=>!x.done)}:null};
const cvar=p=>{const c=COLORS[p.color%COLORS.length];return `--c1:${c[0]};--c2:${c[1]}`};
const P=id=>S.projects.find(p=>p.id===id);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const hue=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h};

function track(p,big){
  if(!p.stages.length) return '<div class="cnt">還沒有階段</div>';
  const cur=curStage(p);
  return `<div class="track${big?' big':''}">${p.stages.map(s=>{const t=s.todos.length,d=s.todos.filter(x=>x.done).length;
    return `<div class="seg${s===cur?' cur':''}" style="flex:${Math.max(1,t)}" title="${esc(s.name)} ${d}/${t}"><span class="sn">${esc(s.name)}</span><i><b style="width:${t?d/t*100:0}%"></b></i><span class="sc">${d}/${t} 完成</span></div>`}).join('')}</div>`}

function scriptCode(tok){return `const TOKEN = '${(tok||'在這裡填同步密碼').replace(/['\\\\]/g,'')}';
const FILE = 'my-dashboard-data.json';

function doPost(e) {
  const out = o => ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
  let b;
  try { b = JSON.parse(e.postData.contents); } catch (err) { return out({ ok: false, error: 'bad request' }); }
  if (b.token !== TOKEN) return out({ ok: false, error: 'unauthorized' });
  const it = DriveApp.getFilesByName(FILE);
  const f = it.hasNext() ? it.next() : null;
  if (b.action === 'get') {
    if (!f) return out({ ok: true, updatedAt: 0, data: null });
    const j = JSON.parse(f.getBlob().getDataAsString());
    return out({ ok: true, updatedAt: j.updatedAt || 0, data: j });
  }
  if (b.action === 'set') {
    const lock = LockService.getScriptLock();
    lock.waitLock(10000);
    try {
      const txt = JSON.stringify(b.data);
      if (f) f.setContent(txt); else DriveApp.createFile(FILE, txt, 'application/json');
    } finally { lock.releaseLock(); }
    return out({ ok: true });
  }
  return out({ ok: false, error: 'unknown action' });
}`}

/* ---- toast / modal ---- */
function toast(text,kind,undo){const el=document.createElement('div');el.className='toast'+(kind==='bad'?' bad':'');el.setAttribute('role','status');
  el.innerHTML=`<span>${esc(text)}</span>`+(undo?'<button type="button">復原</button>':'');
  if(undo) el.querySelector('button').addEventListener('click',()=>{S=JSON.parse(undo);save();if(route().v==='home'&&location.hash)0;render();el.remove();toast('已復原')});
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),undo?6000:2600)}
let lastFocus=null;
function closeModal(){$('#modal').innerHTML='';lastFocus&&lastFocus.focus&&lastFocus.focus()}
function modal(title,body,okText,onOk,danger){lastFocus=document.activeElement;
  $('#modal').innerHTML=`<div class="ovl"><form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate><h2>${esc(title)}</h2>${body}<div class="row"><button type="button" class="btn ghost" data-close>取消</button><button type="submit" class="btn${danger?' danger':''}">${esc(okText)}</button></div></form></div>`;
  const f=$('#modal form');const first=f.querySelector('input:not([type=radio]),textarea,button');first&&first.focus();
  f.addEventListener('submit',e=>{e.preventDefault();if(onOk(f)!==false)closeModal()});
  $('#modal .ovl').addEventListener('click',e=>{if(e.target.classList.contains('ovl')||e.target.closest('[data-close]'))closeModal()})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').firstChild)closeModal()});
const need=(f,name,msg)=>{const i=f.elements[name],w=i.closest('.fld');if(!i.value.trim()){w.classList.add('err');w.querySelector('.msg').textContent=msg;i.focus();return false}w.classList.remove('err');return true};

   <div class="fld"><label for="pl">相關網址（可不填）</label><input class="in" id="pl" name="link" value="${esc(e?p.link:'')}" placeholder="https://" inputmode="url"><span class="msg"></span></div>
   <div><div class="lab">圖示</div><div class="pick">${EMOJI.map((x,i)=>`<label><input type="radio" name="emoji" value="${x}"${(e?p.emoji===x:i===0)?' checked':''}><span>${x}</span></label>`).join('')}</div></div>
   <div><div class="lab">顏色</div><div class="pick">${COLORS.map((c,i)=>`<label><input type="radio" name="color" value="${i}"${(e?p.color===i:i===S.projects.length%COLORS.length)?' checked':''}><span class="c" style="--c1:${c[0]};--c2:${c[1]}" title="顏色 ${i+1}"></span></label>`).join('')}</div></div>
   ${e?'':`<div><div class="lab">階段怎麼分</div><div class="pick"><label><input type="radio" name="tpl" value="one" checked><span class="w">一張清單就好</span></label><label><input type="radio" name="tpl" value="web"><span class="w">構想 → 製作 → 上線</span></label><label><input type="radio" name="tpl" value="learn"><span class="w">入門 → 練習 → 做作品</span></label></div></div>`}`,
   e?'儲存':'建立專案',f=>{
    if(!need(f,'name','請輸入專案名稱'))return false;
    let link=f.elements.link.value.trim();if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
    const v={name:f.elements.name.value.trim(),desc:f.elements.desc.value.trim(),link,emoji:f.elements.emoji.value,color:+f.elements.color.value};
    if(e){Object.assign(p,v);save();render();toast('已儲存')}
    else{const np=Object.assign({id:uid(),notes:'',stages:TEMPLATES[f.elements.tpl.value].map(n=>({id:uid(),name:n,todos:[]}))},v);S.projects.push(np);save();go('p/'+np.id);render();toast('已建立「'+np.name+'」')}})}
function linkForm(){const groups=[...new Set(S.links.map(l=>l.group).filter(Boolean))];
  modal('新增收藏',`
   <div class="fld"><label for="lu">網址</label><input class="in" id="lu" name="url" placeholder="https://" inputmode="url"><span class="msg"></span></div>
   <div class="fld"><label for="lt">名稱</label><input class="in" id="lt" name="title" maxlength="30" placeholder="不填就用網域名稱"><span class="msg"></span></div>
   <div class="fld"><label for="lg">分類</label><input class="in" id="lg" name="group" list="lgs" maxlength="20" placeholder="例如：設計靈感"><datalist id="lgs">${groups.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>`,
   '加入收藏',f=>{if(!need(f,'url','請輸入網址'))return false;
    let url=f.elements.url.value.trim();if(!/^https?:\/\//i.test(url))url='https://'+url;
    try{new URL(url)}catch(err){const w=f.elements.url.closest('.fld');w.classList.add('err');w.querySelector('.msg').textContent='網址格式不對，例如 https://example.com';return false}
    S.links.push({id:uid(),url,title:f.elements.title.value.trim()||host(url),group:f.elements.group.value.trim()||'未分類'});save();render();toast('已加入收藏')})}
function confirmBox(title,text,ok,fn){modal(title,`<p>${esc(text)}</p>`,ok,()=>{fn()},true)}

/* ---- actions ---- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  const a=e.target.closest('[data-act]');
  if(a){const d=a.dataset,p=d.p&&P(d.p),s=p&&d.s&&p.stages.find(x=>x.id===d.s),snap=JSON.stringify(S);
    switch(d.act){
      case 'toggle':{const t=s.todos.find(x=>x.id===d.t);t.done=a.checked;save();const was=pstat(p);render();if(a.checked&&was.t&&was.d===was.t)toast('「'+p.name+'」全部完成 🎉');return}
      case 'delTodo':s.todos=s.todos.filter(x=>x.id!==d.t);save();render();toast('已刪除待辦',null,snap);return
      case 'addStage':p.stages.push({id:uid(),name:'新階段',todos:[]});save();render();{const ins=document.querySelectorAll('[data-f=stageName]');const i=ins[ins.length-1];i&&(i.focus(),i.select())}return
      case 'delStage':{const del=()=>{p.stages=p.stages.filter(x=>x.id!==s.id);save();render();toast('已刪除階段',null,snap)};s.todos.length?confirmBox('刪除「'+s.name+'」？','裡面的 '+s.todos.length+' 個待辦會一起刪除。','刪除',del):del();return}
      case 'delProject':confirmBox('刪除「'+p.name+'」？','專案裡的階段、待辦和筆記都會刪除。刪除後幾秒內還能復原。','刪除專案',()=>{S.projects=S.projects.filter(x=>x.id!==p.id);save();go('');render();toast('已刪除專案',null,snap)});return
      case 'editProject':projectForm(p);return
      case 'newProject':projectForm();return
      case 'newLink':linkForm();return
      case 'delLink':e.preventDefault();S.links=S.links.filter(x=>x.id!==d.id);save();render();toast('已移除收藏',null,snap);return
      case 'clearExample':S.projects=[];S.links=[];S.example=false;save();render();toast('已清空範例',null,snap);return
      case 'export':{const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='my-dashboard-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('已下載備份檔');return}
      case 'copyScript':{const t=scriptCode($('#tok').value.trim());const ok=()=>toast('已複製程式碼');try{navigator.clipboard.writeText(t).then(ok,()=>toast('複製失敗，請手動選取程式碼','bad'))}catch(err){toast('複製失敗，請手動選取程式碼','bad')}return}
      case 'saveSync':{const url=$('#url').value.trim(),tok=$('#tok').value.trim(),w=$('#f-url');
        if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){w.classList.add('err');w.querySelector('.msg').textContent='網址要是 https://script.google.com/ 開頭、/exec 結尾';return}
        if(!tok){toast('請先填同步密碼','bad');$('#tok').focus();return}
        CFG={url,token:tok};try{localStorage.setItem(LSC,JSON.stringify(CFG))}catch(err){}pull(true);return}
      case 'offSync':CFG={url:'',token:''};try{localStorage.removeItem(LSC)}catch(err){}syncState='off';render();toast('已關閉同步，資料留在這台裝置');return
    }}
  if(g){if(e.target.closest('a.tile'))return;go(g.dataset.go);}
});
document.addEventListener('change',e=>{const i=e.target,d=i.dataset;
  if(i.id==='imp'&&i.files[0]){const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);if(!Array.isArray(j.projects)||!Array.isArray(j.links))throw 0;const snap=JSON.stringify(S);S=j;save();render();toast('已從備份還原',null,snap)}catch(err){toast('這個檔案不是工作台的備份檔','bad')}};fr.readAsText(i.files[0]);return}
  if(!d.f)return;const p=P(d.p);if(!p)return;const s=d.s&&p.stages.find(x=>x.id===d.s);
  if(d.f==='stageName'){s.name=i.value.trim()||'未命名';i.value=s.name}
  else if(d.f==='todoText'){const t=s.todos.find(x=>x.id===d.t);if(!i.value.trim()){i.value=t.text;return}t.text=i.value.trim()}
  else if(d.f==='notes'){p.notes=i.value}
  S.example=false;save();renderSide()});
document.addEventListener('input',e=>{if(e.target.id==='tok'){const c=$('#code');if(c)c.textContent=scriptCode(e.target.value.trim())}});
document.addEventListener('keydown',e=>{const i=e.target;
  if(e.key==='Enter'&&i.dataset&&i.dataset.add&&!e.isComposing){const v=i.value.trim();if(!v)return;const p=P(i.dataset.p),s=p.stages.find(x=>x.id===i.dataset.add);s.todos.push(T(v));S.example=false;save();render();const n=document.querySelector(`[data-add="${s.id}"]`);n&&n.focus()}
  else if(e.key==='Enter'&&i.classList&&i.classList.contains('inl')&&!e.isComposing)i.blur()});

/* ---- sync（Google Apps Script，後寫的蓋掉先寫的） ---- */
async function api(body){const r=await fetch(CFG.url,{method:'POST',body:JSON.stringify(Object.assign({token:CFG.token},body))});const j=await r.json();if(!j.ok)throw new Error(j.error||'sync error');return j}
function setSync(st){syncState=st;if(st==='ok')syncAt=Date.now();renderSide();const t=document.querySelector('.top p');if(t&&route().v==='settings')t.textContent=syncLabel()}
async function push(){if(!CFG.url)return;setSync('busy');try{await api({action:'set',data:S});setSync('ok')}catch(e){setSync('bad')}}
async function pull(loud){if(!CFG.url)return;setSync('busy');
  try{const j=await api({action:'get'});
    if(j.data&&j.updatedAt>S.updatedAt){S=j.data;persist();setSync('ok');render();loud&&toast('已載入雲端上較新的資料')}
    else if(S.updatedAt>(j.updatedAt||0)||!j.data){await api({action:'set',data:S});setSync('ok');if(loud){render();toast('同步完成')}}
    else{setSync('ok');if(loud){render();toast('同步完成')}}
  }catch(e){setSync('bad');if(loud){render();toast(e.message==='unauthorized'?'同步密碼和腳本裡的不一樣':'連不上同步網址，請檢查部署設定','bad')}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});

render();pull();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
