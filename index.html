<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的工作台</title>
<meta name="theme-color" content="#8F5CF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap">
<style>
/* 電腦：白底、粗標題、細線分隔的編輯式版面（跟新約讀經本同一套）。手機：霧面玻璃卡片 + 底部浮動選單。 */
:root{
  --ink:#121322; --muted:#5E6170; --faint:#9496A3; --line:#E6E5EB; --soft:#F7F6F3;
  --accent:#8F5CF0; --accent-ink:#6E3FD1; --accent-soft:#F1EAFE; --danger:#C8264A; --ok:#0B7A69;
  --on:#121322; --on-mute:#5E6170; --on-line:#E6E5EB; --rule:#121322; --field:#F7F6F3;
  --dur:.16s;
  --f:"Nunito Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.7 var(--f);color:var(--on);background:#fff;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:20px;height:20px;flex:none}
.solid{--on:#121322;--on-mute:#5E6170;--on-line:#E6E5EB;--field:#F7F6F3;background:#fff;color:var(--on)}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}

/* ---- sidebar ---- */
.side{position:sticky;top:0;height:100vh;height:100dvh;padding:20px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:900;font-size:17px}
.brand img{width:28px;height:28px;border-radius:7px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:none;font-weight:700;color:var(--muted);transition:background var(--dur),color var(--dur)}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav[aria-current=page]{background:var(--soft);color:var(--ink);font-weight:900}
.nav .ic{width:18px;height:18px}
.nav .pc{color:var(--c)}
.nav .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav small{font-weight:800;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.side h2{font-size:12px;color:var(--faint);padding:18px 10px 6px;font-weight:800}
.side .sp{flex:1}
.sync{font-size:12.5px;color:var(--faint);padding:8px 10px;display:flex;gap:8px;align-items:center;font-weight:700}
.sync i{width:8px;height:8px;border-radius:50%;background:#C9CAD3;flex:none}
.sync.ok i{background:var(--ok)} .sync.bad i{background:var(--danger)} .sync.busy i{background:#C98A0B;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---- main ---- */
main{padding:44px clamp(20px,4vw,56px) 72px;display:flex;flex-direction:column;gap:28px;min-width:0;max-width:1160px;width:100%}
.mast{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:22px;border-bottom:3px solid var(--rule)}
.mast .kick{font-size:13.5px;font-weight:700;color:var(--on-mute)}
.mast h1{font-size:40px;font-weight:900;letter-spacing:-.015em;line-height:1.25}
.stats{display:flex;gap:28px;align-items:flex-end}
.stats div{display:flex;flex-direction:column;line-height:1.2}
.stats b{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:12.5px;font-weight:700;color:var(--on-mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:9px 16px;font-weight:800;font-size:14.5px;color:#fff;background:var(--accent);transition:background var(--dur),transform var(--dur);white-space:nowrap}
.btn .ic{width:16px;height:16px}
.btn:hover{background:var(--accent-ink)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--field);color:var(--on)}
.btn.ghost:hover{background:var(--on-line)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:5px 11px;font-size:13px}
.ib{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--field);color:var(--on);transition:background var(--dur)}
.ib:hover{background:var(--on-line)}
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:start}
.rail{display:grid;gap:36px;align-content:start}
.panel{display:flex;flex-direction:column;min-width:0}
.panel>h2{font-size:15px;font-weight:900;padding-bottom:10px;border-bottom:2px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.panel>h2 small,.lk{font-size:13px;font-weight:700;color:var(--on-mute)}
.lk{background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:color var(--dur),text-decoration-color var(--dur)}
.lk:hover{color:var(--accent-ink);text-decoration-color:var(--accent)}

/* ---- 進度軌：每段是一個階段，長度＝待辦數，填滿＝完成比例 ---- */
.lane{display:grid;grid-template-columns:42px minmax(150px,230px) minmax(0,1fr) 62px;gap:16px;align-items:center;padding:18px 12px;margin:0 -12px;width:calc(100% + 24px);border:0;border-bottom:1px solid var(--line);background:none;text-align:left;border-radius:8px;transition:background var(--dur)}
.lane:hover{background:var(--soft)}
.lane:hover .nm{color:var(--c)}
.pi{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--cs);color:var(--c);flex:none}
.pi .ic{width:22px;height:22px}
.who{min-width:0}
.who .nm{display:block;font-weight:900;font-size:16.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color var(--dur)}
.who small{display:block;color:var(--on-mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-size:22px;font-weight:900;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pct.full{color:var(--c)}
.track{display:flex;gap:4px;min-width:0}
.seg{min-width:0;display:flex;flex-direction:column;gap:5px}
.seg .sn{font-size:12px;font-weight:700;color:var(--on-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg.cur .sn{color:var(--on);font-weight:900}
.seg i{display:block;height:8px;border-radius:99px;background:var(--cs);overflow:hidden}
.seg i b{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.track.big .seg i{height:12px}
.track.big .seg .sn{font-size:13.5px}
.seg .sc{font-size:12px;color:var(--on-mute);font-variant-numeric:tabular-nums;font-weight:600}
.track:not(.big) .sc{display:none}

.next{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--on-line)}
.next .ck{margin-top:2px}
.next .t{flex:1;min-width:0}
.next .t b{display:block;font-weight:800;line-height:1.45}
.next .t small{color:var(--on-mute);font-size:12.5px;font-weight:600}
.ck{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:6px;border:2px solid #C9CAD3;margin:0;flex:none;cursor:pointer;display:grid;place-items:center;background:#fff;transition:background var(--dur),border-color var(--dur),transform var(--dur)}
.ck:hover{border-color:var(--c,var(--accent))}
.ck:active{transform:scale(.88)}
.ck:checked{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.ck:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translateY(-1px)}
.row{position:relative;display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--on-line);text-decoration:none;color:var(--on)}
.row:hover b{color:var(--accent-ink)}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none;background:var(--field);color:var(--on)}
.row .tt{flex:1;min-width:0}
.row b{display:block;font-weight:800;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color var(--dur)}
.row small{display:block;font-size:12.5px;color:var(--on-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:26px;height:26px;border-radius:50%;border:0;background:none;color:var(--faint);display:grid;place-items:center;flex:none;opacity:0;transition:opacity var(--dur),color var(--dur),background var(--dur)}
.x .ic{width:14px;height:14px}
.x:hover{color:var(--danger);background:var(--field)}
.row:hover .x,.todo:hover .x,.col header:hover .x,.x:focus-visible{opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 32px}

/* ---- project page ---- */
.phead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding-bottom:24px;border-bottom:3px solid var(--rule)}
.phead .pi{width:64px;height:64px;border-radius:14px}
.phead .pi .ic{width:32px;height:32px}
.phead h1{font-size:34px;font-weight:900;letter-spacing:-.015em;line-height:1.25}
.phead p{color:var(--on-mute);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:99px;border:1px solid var(--on-line);background:none;font-size:13px;font-weight:800;color:var(--on);text-decoration:none;transition:background var(--dur),border-color var(--dur)}
.pill .ic{width:14px;height:14px}
button.pill:hover,a.pill:hover{background:var(--field);border-color:var(--faint)}
.pill.on{background:var(--cs);border-color:transparent;color:var(--c)}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--cs)} .ring .fg{stroke:var(--c);transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity}
.col{flex:0 0 290px;padding:12px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;background:var(--soft);border-radius:12px;border:1.5px solid transparent}
.col.cur{border-color:var(--c);background:#fff}
.col header{display:flex;gap:6px;align-items:center}
.inl{flex:1;min-width:0;border:0;background:none;padding:3px 6px;border-radius:6px;transition:background var(--dur)}
.inl:hover{background:var(--field)}
.inl:focus{outline:0;background:#fff;box-shadow:0 0 0 2px var(--c,var(--accent));color:var(--ink)}
.col header .inl{font-weight:900;font-size:15px}
.cnt{font-size:12.5px;font-weight:800;color:var(--on-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11.5px;font-weight:900;padding:1px 8px;border-radius:99px;background:var(--cs);color:var(--c);white-space:nowrap}
.todo{display:flex;gap:8px;align-items:center;padding:7px 6px 7px 10px;border:1px solid var(--line);border-radius:8px}
.todo .inl{font-size:14.5px;font-weight:600}
.todo.done .inl{color:var(--faint);text-decoration:line-through}
.add{border:1.5px dashed #C9CAD3;background:none;border-radius:8px;padding:8px 12px;width:100%;transition:border-color var(--dur),background var(--dur)}
.add::placeholder{color:var(--on-mute)}
.add:focus{outline:0;border-style:solid;border-color:var(--c,var(--accent));background:#fff;color:var(--ink)}
.newcol{flex:0 0 190px;display:flex;gap:6px;align-items:center;justify-content:center;border:1.5px dashed #C9CAD3;background:none;border-radius:12px;padding:16px;font-weight:800;color:var(--on-mute);transition:background var(--dur),color var(--dur)}
.newcol:hover{background:var(--field);color:var(--on)}
.empty{text-align:center;padding:28px 12px;color:var(--on-mute);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .e{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--on-mute)}
.empty b{color:var(--on)}
textarea.note{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;color:var(--ink);resize:vertical;line-height:1.8;margin-top:14px}
textarea.note:focus{outline:0;border-color:var(--c,var(--accent));box-shadow:0 0 0 2px var(--cs,var(--accent-soft))}
.body{display:flex;flex-direction:column;gap:14px;padding-top:16px}

/* ---- forms / modal / toast ---- */
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.lab{font-size:13.5px;font-weight:800}
.in{border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;color:var(--ink);width:100%;transition:border-color var(--dur),box-shadow var(--dur)}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld.err .in{border-color:var(--danger)} .fld .msg{font-size:12.5px;color:var(--on-mute)} .fld.err .msg{color:var(--danger)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--muted);border:2px solid transparent;transition:border-color var(--dur),color var(--dur)}
.pick span.c{background:var(--c);border-radius:50%;width:32px;height:32px;box-shadow:inset 0 0 0 3px #fff}
.pick span.w{width:auto;padding:0 14px;font-size:13.5px;font-weight:800}
.pick input:checked+span{border-color:var(--ink);color:var(--ink)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(18,19,34,.45);display:grid;place-items:center;padding:16px;animation:fade var(--dur)}
.modal{width:min(480px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:#fff;color:var(--ink);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .2s}
.modal h2{font-size:20px;font-weight:900}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(10px)}}
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);font-weight:700;font-size:14px;animation:pop .2s}
.toast.bad{background:var(--danger)}
.toast button{border:0;background:none;color:#C9B3FF;font-weight:900;padding:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
pre.code{margin:0;background:var(--ink);color:#E3E4EE;border-radius:10px;padding:14px;font:12px/1.55 ui-monospace,Menlo,monospace;overflow:auto;max-height:220px;white-space:pre}
.acts2{display:flex;flex-wrap:wrap;gap:10px}
.dock,.mback{display:none}
.settings{max-width:720px}

/* ---- 手機：霧面玻璃 ---- */
@media (max-width:820px){
  :root{--on:#fff;--on-mute:rgba(255,255,255,.8);--on-line:rgba(255,255,255,.26);--rule:rgba(255,255,255,.5);--field:rgba(255,255,255,.16)}
  body{background:linear-gradient(170deg,#7d95b2 0%,#526a89 34%,#35465f 68%,#222d42 100%) fixed}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(112px + env(safe-area-inset-bottom,0px));gap:20px}
  .mast{border-bottom:0;padding-bottom:0}
  .mast h1{font-size:38px;line-height:1.15}
  .mast .btn{display:none}
  .stats{width:100%;gap:8px}
  .stats div{flex:1;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .stats b{font-size:24px}
  .home{grid-template-columns:minmax(0,1fr);gap:20px}
  .rail{gap:20px}
  .panel{padding:16px;border-radius:22px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 12px 34px rgba(10,16,30,.22)}
  .panel>h2{border-bottom:0;padding-bottom:6px}
  .lanes{display:grid;gap:10px}
  .lane{--on:#121322;--on-mute:#5E6170;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;margin:0;width:100%;padding:14px;background:#fff;color:#121322;border:0;border-radius:16px;box-shadow:0 8px 22px rgba(10,16,30,.18)}
  .lane:hover{background:#fff}
  .lane .track{grid-column:1/-1;grid-row:2}
  .phead{grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:22px;border-bottom:0;border-radius:26px;background:var(--c);color:#fff;--on:#fff;--on-mute:rgba(255,255,255,.88);--on-line:rgba(255,255,255,.4);--field:rgba(255,255,255,.18);box-shadow:0 16px 36px rgba(10,16,30,.3)}
  .phead .pi{grid-column:1;width:48px;height:48px;background:rgba(255,255,255,.2);color:#fff}
  .phead .pi .ic{width:26px;height:26px}
  .phead .info{grid-column:1/-1}
  .phead .ring{grid-column:2;grid-row:1;width:76px;height:76px}
  .phead h1{font-size:30px}
  .ring .bg{stroke:rgba(255,255,255,.28)} .ring .fg{stroke:#fff} .ring b{font-size:18px}
  .pill.on{background:rgba(255,255,255,.22);color:#fff;border-color:transparent}
  .board{margin-inline:-16px;padding-inline:16px;scroll-snap-type:x mandatory}
  .col{flex-basis:84vw;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:20px}
  .col.cur{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.7)}
  .tag{background:#fff}
  .todo{--on:#121322;background:#fff;color:#121322;border:0;border-radius:12px;padding:10px 8px 10px 12px}
  .todo .inl:hover{background:none}
  .add,.newcol{border-color:rgba(255,255,255,.45)}
  .x{opacity:1;color:inherit}
  .todo .x{color:var(--faint)}
  .av{background:rgba(255,255,255,.2)}
  .row:hover b{color:inherit}
  .lk:hover{color:#fff;text-decoration-color:#fff}
  .grid{grid-template-columns:minmax(0,1fr)}
  .mback{display:flex;justify-content:space-between;align-items:center}
  .mback .ib{width:44px;height:44px;border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .mback b{font-weight:900;font-size:16px}
  .dock{display:flex;position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));gap:6px;padding:7px;border-radius:99px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.36);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 14px 34px rgba(8,12,24,.35)}
  .dock button{width:52px;height:52px;border-radius:50%;border:0;background:none;color:#fff;display:grid;place-items:center;transition:background var(--dur),color var(--dur),transform var(--dur)}
  .dock .ic{width:22px;height:22px}
  .dock button:active{transform:scale(.9)}
  .dock button[aria-current=page]{background:#fff;color:#27354e}
  textarea.note{border:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="app">
  <aside class="side" id="side" aria-label="主選單"></aside>
  <main id="main"></main>
</div>
<nav class="dock" id="dock" aria-label="主選單"></nav>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="seed.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const LS='dash-v1',LSC='dash-sync';
/* 顏色：[主色, 淺底] */
const COLORS=[['#8F5CF0','#F1EAFE'],['#0B7A69','#E0F3EF'],['#C8264A','#FBE8ED'],['#946000','#FBF1DA'],['#2563C9','#E6EEFB'],['#B8410E','#FBEDE5'],['#4B5568','#ECEEF2'],['#2F7D32','#E6F3E6']];
const ICONS={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 settings:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>', back:'<path d="M15 18l-6-6 6-6"/>', out:'<path d="M7 17 17 7M9 7h8v8"/>',
 pen:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 book:'<path d="M12 7v13"/><path d="M3 5h6a3 3 0 0 1 3 3 3 3 0 0 1 3-3h6v13h-6a3 3 0 0 0-3 2 3 3 0 0 0-3-2H3z"/>',
 cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/>',
 flag:'<path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.500-6s6.500 2.500 6.500 6"/><path d="M16 4.600a3.500 3.500 0 0 1 0 6.800M18.500 14.500c1.800.9 3 2.900 3 5.500"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-7 8-7s8 3 8 7"/>',
 layout:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
 palette:'<path d="M12 3a9 9 0 1 0 0 18c1.500 0 2-1 2-2 0-1.500 1-2 2-2h2a3 3 0 0 0 3-3c0-5-4-9-9-9z"/><circle cx="7.500" cy="11.500" r="1"/><circle cx="10.500" cy="7.500" r="1"/><circle cx="15" cy="8" r="1"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.500 3 14.500 0 18M12 3c-3 3.500-3 14.500 0 18"/>',
 code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',
 bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.500c.7.700 1 1.500 1 2.500h6c0-1 .3-1.800 1-2.500A6 6 0 0 0 12 3z"/>',
 send:'<path d="M21 3 10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>',
 star:'<path d="M12 3l2.700 5.600 6.100.9-4.400 4.300 1 6.100L12 17l-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z"/>',
 heart:'<path d="M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/>',
 cup:'<path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h1.500a2.500 2.500 0 0 1 0 5H17M8 3v2M12 3v2"/>'};
const PICK=['book','cap','flag','users','user','layout','palette','globe','code','bulb','send','star','heart','pen'];
const ic=k=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[k]||ICONS.star)+'</svg>';
const TEMPLATES={one:['待辦'],web:['構想','製作','上線'],learn:['入門','練習','做作品']};
const T=(text,done)=>({id:uid(),text,done:!!done});

function seed(){const src=window.SEED||{p:[],l:[]};
  return {v:2,updatedAt:0,
   projects:src.p.map(([name,icon,color,desc,link,st])=>({id:uid(),name,icon,color,desc,link,notes:'',stages:st.map(([n,ts])=>({id:uid(),name:n,todos:ts.map(([t,d])=>T(t,d))}))})),
   links:src.l.map(([title,url,group])=>({id:uid(),title,url,group}))}}

let S;try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
if(!S||!S.projects||S.example===true) S=seed();
S.projects.forEach(p=>{if(!p.icon)p.icon='star'});
let CFG={url:'',token:''};try{CFG=Object.assign(CFG,JSON.parse(localStorage.getItem(LSC)||'{}'))}catch(e){}
let syncState=CFG.url?'idle':'off',syncAt=0,syncTimer=null;

function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('儲存失敗：瀏覽器空間不足或被封鎖','bad')}}
function save(){S.updatedAt=Date.now();persist();if(CFG.url){clearTimeout(syncTimer);syncTimer=setTimeout(push,1500)}}

/* ---- stats ---- */
const pstat=p=>{let t=0,d=0;p.stages.forEach(s=>{t+=s.todos.length;d+=s.todos.filter(x=>x.done).length});return {t,d,pct:t?Math.round(d/t*100):0}};
const curStage=p=>p.stages.find(s=>s.todos.some(x=>!x.done))||null;
const nextTodo=p=>{const s=curStage(p);return s?{s,t:s.todos.find(x=>!x.done)}:null};
const cvar=p=>{const c=COLORS[p.color%COLORS.length];return `--c:${c[0]};--cs:${c[1]}`};
const P=id=>S.projects.find(p=>p.id===id);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};

function track(p,big){
  if(!p.stages.length) return '<div class="cnt">還沒有階段</div>';
  const cur=curStage(p);
  return `<div class="track${big?' big':''}">${p.stages.map(s=>{const t=s.todos.length,d=s.todos.filter(x=>x.done).length;
    return `<div class="seg${s===cur?' cur':''}" style="flex:${Math.max(1,t)}" title="${esc(s.name)} ${d}/${t}"><span class="sn">${esc(s.name)}</span><i><b style="width:${t?d/t*100:0}%"></b></i><span class="sc">${d}/${t} 完成</span></div>`}).join('')}</div>`}

/* ---- routing ---- */
const route=()=>{const h=location.hash.replace(/^#\/?/,'');const m=h.match(/^p\/(.+)$/);if(m&&P(m[1]))return {v:'project',id:m[1]};return {v:['links','settings'].includes(h)?h:'home'}};
const go=h=>{location.hash='#/'+h};
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---- views ---- */
function renderSide(){const r=route();
  const cur=(v,id)=>r.v===v&&(id==null||r.id===id)?' aria-current="page"':'';
  $('#side').innerHTML=`<div class="brand"><img src="icon-192.png" alt="">我的工作台</div>
   <button class="nav" data-go=""${cur('home')}>${ic('home')}<span class="nm">總覽</span></button>
   <button class="nav" data-go="links"${cur('links')}>${ic('bookmark')}<span class="nm">收藏網站</span><small>${S.links.length}</small></button>
   <h2>專案</h2>
   ${S.projects.map(p=>`<button class="nav" data-go="p/${p.id}"${cur('project',p.id)} style="${cvar(p)}"><span class="pc" style="display:grid">${ic(p.icon)}</span><span class="nm">${esc(p.name)}</span><small>${pstat(p).pct}%</small></button>`).join('')}
   <button class="nav" data-act="newProject">${ic('plus')}<span class="nm">新增專案</span></button>
   <div class="sp"></div>
   <div class="sync ${({ok:'ok',bad:'bad',busy:'busy'})[syncState]||''}"><i></i><span>${syncLabel()}</span></div>
   <button class="nav" data-go="settings"${cur('settings')}>${ic('settings')}<span class="nm">設定與同步</span></button>`;
  $('#dock').innerHTML=`<button data-go=""${cur('home')} aria-label="總覽">${ic('home')}</button><button data-go="links"${cur('links')} aria-label="收藏網站">${ic('bookmark')}</button><button data-act="newProject" aria-label="新增專案">${ic('plus')}</button><button data-go="settings"${cur('settings')} aria-label="設定">${ic('settings')}</button>`}
function syncLabel(){return {off:'只存在這台裝置',idle:'已設定同步',busy:'同步中…',ok:'已同步 '+new Date(syncAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),bad:'同步失敗，資料仍在本機'}[syncState]}
const emptyBox=(icon,title,text,btn)=>`<div class="empty"><div class="e">${ic(icon)}</div>${title?`<b>${title}</b>`:''}<span>${text}</span>${btn||''}</div>`;

function viewHome(){
  const all=S.projects.map(pstat),t=all.reduce((a,x)=>a+x.t,0),d=all.reduce((a,x)=>a+x.d,0);
  const today=new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});
  const nexts=S.projects.map(p=>({p,n:nextTodo(p)})).filter(x=>x.n);
  return `<header class="mast"><div><p class="kick">${today}</p><h1>我的專案</h1></div>
    <div class="stats"><div><b>${S.projects.length}</b><span>個專案</span></div><div><b>${t-d}</b><span>件還沒做</span></div><div><b>${d}</b><span>件已完成</span></div></div>
    <button class="btn" data-act="newProject">${ic('plus')}新增專案</button></header>
  <div class="home">
   <section class="panel"><h2>專案進度 <small>每一段是一個階段</small></h2>
    <div class="lanes">${S.projects.length?S.projects.map(p=>{const st=pstat(p),n=nextTodo(p);return `<button class="lane" data-go="p/${p.id}" style="${cvar(p)}"><span class="pi">${ic(p.icon)}</span><span class="who"><span class="nm">${esc(p.name)}</span><small>${n?'下一步：'+esc(n.t.text):st.t?'全部完成':'還沒有待辦'}</small></span>${track(p)}<span class="pct${st.t&&st.d===st.t?' full':''}">${st.pct}%</span></button>`}).join('')
     :emptyBox('layout','還沒有專案','建立第一個專案，進度會顯示在這裡。',`<button class="btn" data-act="newProject">${ic('plus')}新增專案</button>`)}</div>
   </section>
   <aside class="rail">
    <section class="panel"><h2>下一步可以做</h2>
     ${nexts.length?nexts.map(({p,n})=>`<div class="next" style="${cvar(p)}"><input type="checkbox" class="ck" data-act="toggle" data-p="${p.id}" data-s="${n.s.id}" data-t="${n.t.id}" aria-label="完成 ${esc(n.t.text)}"><div class="t"><b>${esc(n.t.text)}</b><small>${esc(p.name)} · ${esc(n.s.name)}</small></div></div>`).join('')
      :emptyBox('cup','','目前沒有待辦，可以休息一下。')}
    </section>
    <section class="panel"><h2>收藏網站 <button class="lk" data-go="links">全部 ${S.links.length} 個</button></h2>
     ${S.links.length?S.links.slice(0,6).map(linkRow).join(''):emptyBox('bookmark','','還沒有收藏。',`<button class="btn sm" data-act="newLink">${ic('plus')}新增收藏</button>`)}
    </section>
   </aside>
  </div>`}
function linkRow(l){return `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="av">${esc((l.title.trim()[0]||'?').toUpperCase())}</span><span class="tt"><b>${esc(l.title)}</b><small>${esc(host(l.url))}</small></span><button class="x" data-act="delLink" data-id="${l.id}" aria-label="刪除 ${esc(l.title)}">${ic('x')}</button></a>`}

function viewProject(p){const st=pstat(p),cur=curStage(p),C=2*Math.PI*42;
  return `<div class="mback"><button class="ib" data-go="" aria-label="回總覽">${ic('back')}</button><b>專案</b><button class="ib" data-act="editProject" data-p="${p.id}" aria-label="編輯專案">${ic('pen')}</button></div>
  <header class="phead" style="${cvar(p)}"><span class="pi">${ic(p.icon)}</span>
    <div class="info"><h1>${esc(p.name)}</h1>${p.desc?`<p>${esc(p.desc)}</p>`:''}
     <div class="meta"><span class="pill on">${st.d} / ${st.t} 完成</span>${cur?`<span class="pill">目前：${esc(cur.name)}</span>`:st.t?'<span class="pill">全部完成</span>':''}${p.link?`<a class="pill" href="${esc(p.link)}" target="_blank" rel="noopener">開啟網站${ic('out')}</a>`:''}<button class="pill" data-act="editProject" data-p="${p.id}">${ic('pen')}編輯</button></div></div>
    <div class="ring"><svg viewBox="0 0 96 96" width="100%" height="100%"><circle class="bg" cx="48" cy="48" r="42"/><circle class="fg" cx="48" cy="48" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-st.pct/100)}"/></svg><b>${st.pct}%</b></div></header>
  <section class="panel" style="${cvar(p)}"><h2>進度</h2><div class="body">${track(p,true)}</div></section>
  <div class="board" style="${cvar(p)}">
   ${p.stages.map(s=>{const d=s.todos.filter(x=>x.done).length;return `<section class="col${s===cur?' cur':''}"><header><input class="inl" value="${esc(s.name)}" data-f="stageName" data-p="${p.id}" data-s="${s.id}" aria-label="階段名稱">${s===cur?'<span class="tag">進行中</span>':''}<span class="cnt">${d}/${s.todos.length}</span><button class="x" data-act="delStage" data-p="${p.id}" data-s="${s.id}" aria-label="刪除階段 ${esc(s.name)}">${ic('x')}</button></header>
     ${s.todos.map(t=>`<div class="todo solid${t.done?' done':''}"><input type="checkbox" class="ck" ${t.done?'checked':''} data-act="toggle" data-p="${p.id}" data-s="${s.id}" data-t="${t.id}" aria-label="完成"><input class="inl" value="${esc(t.text)}" data-f="todoText" data-p="${p.id}" data-s="${s.id}" data-t="${t.id}" aria-label="待辦內容"><button class="x" data-act="delTodo" data-p="${p.id}" data-s="${s.id}" data-t="${t.id}" aria-label="刪除 ${esc(t.text)}">${ic('x')}</button></div>`).join('')}
     <input class="add" placeholder="新增待辦，按 Enter" data-add="${s.id}" data-p="${p.id}" aria-label="在 ${esc(s.name)} 新增待辦"></section>`}).join('')}
   <button class="newcol" data-act="addStage" data-p="${p.id}">${ic('plus')}新增階段</button></div>
  <section class="panel" style="${cvar(p)}"><h2>筆記 <small>自動儲存</small></h2><textarea class="note" data-f="notes" data-p="${p.id}" placeholder="想法、連結、卡住的地方，都可以寫在這裡">${esc(p.notes||'')}</textarea></section>
  <div><button class="btn ghost sm" data-act="delProject" data-p="${p.id}">刪除這個專案</button></div>`}

function viewLinks(){const groups={};S.links.forEach(l=>(groups[l.group||'未分類']=groups[l.group||'未分類']||[]).push(l));
  return `<header class="mast"><div><p class="kick">常用的網站，一點就開</p><h1>收藏網站</h1></div><button class="btn" data-act="newLink">${ic('plus')}新增收藏</button></header>
  ${S.links.length?Object.keys(groups).map(g=>`<section class="panel"><h2>${esc(g)} <small>${groups[g].length} 個</small></h2><div class="grid">${groups[g].map(linkRow).join('')}</div></section>`).join('')
   :`<section class="panel">${emptyBox('bookmark','還沒有收藏','把常用的網站放進來，之後不用再翻書籤。')}</section>`}
  <div><button class="btn ghost" data-act="newLink">${ic('plus')}新增收藏</button></div>`}

function scriptCode(tok){return `const TOKEN = '${(tok||'在這裡填同步密碼').replace(/['\\\\]/g,'')}';
const FILE = 'my-dashboard-data.json';

function doPost(e) {
  const out = o => ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
  let b;
  try { b = JSON.parse(e.postData.contents); } catch (err) { return out({ ok: false, error: 'bad request' }); }
  if (b.token !== TOKEN) return out({ ok: false, error: 'unauthorized' });
  const it = DriveApp.getFilesByName(FILE);
  const f = it.hasNext() ? it.next() : null;
  if (b.action === 'get') {
    if (!f) return out({ ok: true, updatedAt: 0, data: null });
    const j = JSON.parse(f.getBlob().getDataAsString());
    return out({ ok: true, updatedAt: j.updatedAt || 0, data: j });
  }
  if (b.action === 'set') {
    const lock = LockService.getScriptLock();
    lock.waitLock(10000);
    try {
      const txt = JSON.stringify(b.data);
      if (f) f.setContent(txt); else DriveApp.createFile(FILE, txt, 'application/json');
    } finally { lock.releaseLock(); }
    return out({ ok: true });
  }
  return out({ ok: false, error: 'unknown action' });
}`}
function viewSettings(){
  return `<header class="mast"><div><p class="kick" id="synclab">${syncLabel()}</p><h1>設定與同步</h1></div></header>
  <section class="panel settings"><h2>雲端同步（Google 雲端硬碟）</h2><div class="body">
   <p>資料會存成你 Google 雲端硬碟裡的一個檔案 <b>my-dashboard-data.json</b>，手機和電腦讀寫同一份。設定一次就好：</p>
   <div class="fld"><label for="tok">1. 自己取一組同步密碼</label><input class="in" id="tok" value="${esc(CFG.token)}" placeholder="例如一串你記得住的英數字" autocomplete="off"><span class="msg">只用來保護這份資料，不要用你其他帳號的密碼。</span></div>
   <div class="lab">2. 到 script.google.com 建一個新專案，把下面的程式碼整段貼上</div>
   <pre class="code" id="code">${esc(scriptCode(CFG.token))}</pre>
   <div><button class="btn sm ghost" data-act="copyScript">複製程式碼</button></div>
   <ol class="steps" start="3"><li>右上角「部署」→「新增部署作業」→ 類型選「網頁應用程式」。</li><li>「執行身分」選自己，「誰可以存取」選「所有人」，按部署並同意授權。</li><li>把產生的網址（結尾是 /exec）貼到下面。</li></ol>
   <div class="fld" id="f-url"><label for="url">網頁應用程式網址</label><input class="in" id="url" value="${esc(CFG.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"><span class="msg">其他裝置只要填同一組密碼和網址就會同步。</span></div>
   <div class="acts2"><button class="btn" data-act="saveSync">儲存並同步</button>${CFG.url?'<button class="btn ghost" data-act="offSync">關閉同步</button>':''}</div></div>
  </section>
  <section class="panel settings"><h2>備份</h2><div class="body"><p>把全部資料存成一個檔案，或從檔案還原。</p>
   <div class="acts2"><button class="btn ghost" data-act="export">下載備份檔</button><label class="btn ghost" style="cursor:pointer">從備份檔還原<input type="file" id="imp" accept="application/json,.json" hidden></label></div></div></section>
  <section class="panel settings"><h2>清空資料</h2><div class="body"><p>刪除這台裝置上所有專案和收藏，從空白開始。</p>
   <div><button class="btn ghost" data-act="clearAll">清空全部資料</button></div></div></section>`}

function render(){const r=route();renderSide();
  $('#main').innerHTML=r.v==='project'?viewProject(P(r.id)):r.v==='links'?viewLinks():r.v==='settings'?viewSettings():viewHome();
  document.title=(r.v==='project'?P(r.id).name+'｜':'')+'我的工作台'}

/* ---- toast / modal ---- */
function toast(text,kind,undo){const el=document.createElement('div');el.className='toast'+(kind==='bad'?' bad':'');el.setAttribute('role','status');
  el.innerHTML=`<span>${esc(text)}</span>`+(undo?'<button type="button">復原</button>':'');
  if(undo) el.querySelector('button').addEventListener('click',()=>{S=JSON.parse(undo);save();render();el.remove();toast('已復原')});
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),undo?6000:2600)}
let lastFocus=null;
function closeModal(){$('#modal').innerHTML='';lastFocus&&lastFocus.focus&&lastFocus.focus()}
function modal(title,body,okText,onOk,danger){lastFocus=document.activeElement;
  $('#modal').innerHTML=`<div class="ovl"><form class="modal solid" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate><h2>${esc(title)}</h2>${body}<div class="acts"><button type="button" class="btn ghost" data-close>取消</button><button type="submit" class="btn${danger?' danger':''}">${esc(okText)}</button></div></form></div>`;
  const f=$('#modal form');const first=f.querySelector('input:not([type=radio]),textarea,button');first&&first.focus();
  f.addEventListener('submit',e=>{e.preventDefault();if(onOk(f)!==false)closeModal()});
  $('#modal .ovl').addEventListener('click',e=>{if(e.target.classList.contains('ovl')||e.target.closest('[data-close]'))closeModal()})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').firstChild)closeModal()});
const need=(f,name,msg)=>{const i=f.elements[name],w=i.closest('.fld');if(!i.value.trim()){w.classList.add('err');w.querySelector('.msg').textContent=msg;i.focus();return false}w.classList.remove('err');return true};

function projectForm(p){const e=!!p;
  modal(e?'編輯專案':'新增專案',`
   <div class="fld"><label for="pn">專案名稱</label><input class="in" id="pn" name="name" value="${esc(e?p.name:'')}" placeholder="例如：個人作品集" maxlength="40"><span class="msg"></span></div>
   <div class="fld"><label for="pd">一句話說明（可不填）</label><input class="in" id="pd" name="desc" value="${esc(e?p.desc:'')}" maxlength="80"></div>
   <div class="fld"><label for="pl">相關網址（可不填）</label><input class="in" id="pl" name="link" value="${esc(e?p.link:'')}" placeholder="https://" inputmode="url"><span class="msg"></span></div>
   <div><div class="lab">圖示</div><div class="pick">${PICK.map((x,i)=>`<label><input type="radio" name="icon" value="${x}"${(e?p.icon===x:i===0)?' checked':''}><span>${ic(x)}</span></label>`).join('')}</div></div>
   <div><div class="lab">顏色</div><div class="pick">${COLORS.map((c,i)=>`<label><input type="radio" name="color" value="${i}"${(e?p.color===i:i===S.projects.length%COLORS.length)?' checked':''}><span class="c" style="--c:${c[0]}" title="顏色 ${i+1}"></span></label>`).join('')}</div></div>
   ${e?'':`<div><div class="lab">階段怎麼分</div><div class="pick"><label><input type="radio" name="tpl" value="one" checked><span class="w">一張清單就好</span></label><label><input type="radio" name="tpl" value="web"><span class="w">構想 → 製作 → 上線</span></label><label><input type="radio" name="tpl" value="learn"><span class="w">入門 → 練習 → 做作品</span></label></div></div>`}`,
   e?'儲存':'建立專案',f=>{
    if(!need(f,'name','請輸入專案名稱'))return false;
    let link=f.elements.link.value.trim();if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
    const v={name:f.elements.name.value.trim(),desc:f.elements.desc.value.trim(),link,icon:f.elements.icon.value||(e?p.icon:'star'),color:+f.elements.color.value};
    if(e){Object.assign(p,v);save();render();toast('已儲存')}
    else{const np=Object.assign({id:uid(),notes:'',stages:TEMPLATES[f.elements.tpl.value].map(n=>({id:uid(),name:n,todos:[]}))},v);S.projects.push(np);save();go('p/'+np.id);render();toast('已建立「'+np.name+'」')}})}
function linkForm(){const groups=[...new Set(S.links.map(l=>l.group).filter(Boolean))];
  modal('新增收藏',`
   <div class="fld"><label for="lu">網址</label><input class="in" id="lu" name="url" placeholder="https://" inputmode="url"><span class="msg"></span></div>
   <div class="fld"><label for="lt">名稱</label><input class="in" id="lt" name="title" maxlength="30" placeholder="不填就用網域名稱"><span class="msg"></span></div>
   <div class="fld"><label for="lg">分類</label><input class="in" id="lg" name="group" list="lgs" maxlength="20" placeholder="例如：設計靈感"><datalist id="lgs">${groups.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>`,
   '加入收藏',f=>{if(!need(f,'url','請輸入網址'))return false;
    let url=f.elements.url.value.trim();if(!/^https?:\/\//i.test(url))url='https://'+url;
    try{new URL(url)}catch(err){const w=f.elements.url.closest('.fld');w.classList.add('err');w.querySelector('.msg').textContent='網址格式不對，例如 https://example.com';return false}
    S.links.push({id:uid(),url,title:f.elements.title.value.trim()||host(url),group:f.elements.group.value.trim()||'未分類'});save();render();toast('已加入收藏')})}
function confirmBox(title,text,ok,fn){modal(title,`<p>${esc(text)}</p>`,ok,()=>{fn()},true)}

/* ---- actions ---- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  const a=e.target.closest('[data-act]');
  if(a){const d=a.dataset,p=d.p&&P(d.p),s=p&&d.s&&p.stages.find(x=>x.id===d.s),snap=JSON.stringify(S);
    switch(d.act){
      case 'toggle':{const t=s.todos.find(x=>x.id===d.t);t.done=a.checked;save();const now=pstat(p);render();if(a.checked&&now.t&&now.d===now.t)toast('「'+p.name+'」全部完成');return}
      case 'delTodo':s.todos=s.todos.filter(x=>x.id!==d.t);save();render();toast('已刪除待辦',null,snap);return
      case 'addStage':p.stages.push({id:uid(),name:'新階段',todos:[]});save();render();{const ins=document.querySelectorAll('[data-f=stageName]');const i=ins[ins.length-1];i&&(i.focus(),i.select())}return
      case 'delStage':{const del=()=>{p.stages=p.stages.filter(x=>x.id!==s.id);save();render();toast('已刪除階段',null,snap)};s.todos.length?confirmBox('刪除「'+s.name+'」？','裡面的 '+s.todos.length+' 個待辦會一起刪除。','刪除',del):del();return}
      case 'delProject':confirmBox('刪除「'+p.name+'」？','專案裡的階段、待辦和筆記都會刪除。刪除後幾秒內還能復原。','刪除專案',()=>{S.projects=S.projects.filter(x=>x.id!==p.id);save();go('');render();toast('已刪除專案',null,snap)});return
      case 'editProject':projectForm(p);return
      case 'newProject':projectForm();return
      case 'newLink':linkForm();return
      case 'delLink':e.preventDefault();S.links=S.links.filter(x=>x.id!==d.id);save();render();toast('已移除收藏',null,snap);return
      case 'clearAll':confirmBox('清空全部資料？','所有專案、待辦、筆記和收藏都會刪除。刪除後幾秒內還能復原。','全部清空',()=>{S.projects=[];S.links=[];save();render();toast('已清空',null,snap)});return
      case 'export':{const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='my-dashboard-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('已下載備份檔');return}
      case 'copyScript':{const t=scriptCode($('#tok').value.trim());const ok=()=>toast('已複製程式碼');try{navigator.clipboard.writeText(t).then(ok,()=>toast('複製失敗，請手動選取程式碼','bad'))}catch(err){toast('複製失敗，請手動選取程式碼','bad')}return}
      case 'saveSync':{const url=$('#url').value.trim(),tok=$('#tok').value.trim(),w=$('#f-url');
        if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){w.classList.add('err');w.querySelector('.msg').textContent='網址要是 https://script.google.com/ 開頭、/exec 結尾';return}
        if(!tok){toast('請先填同步密碼','bad');$('#tok').focus();return}
        CFG={url,token:tok};try{localStorage.setItem(LSC,JSON.stringify(CFG))}catch(err){}pull(true);return}
      case 'offSync':CFG={url:'',token:''};try{localStorage.removeItem(LSC)}catch(err){}syncState='off';render();toast('已關閉同步，資料留在這台裝置');return
    }}
  if(g){if(e.target.closest('a.row'))return;go(g.dataset.go)}
});
document.addEventListener('change',e=>{const i=e.target,d=i.dataset;
  if(i.id==='imp'&&i.files[0]){const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);if(!Array.isArray(j.projects)||!Array.isArray(j.links))throw 0;const snap=JSON.stringify(S);j.projects.forEach(p=>{if(!p.icon)p.icon='star'});S=j;save();render();toast('已從備份還原',null,snap)}catch(err){toast('這個檔案不是工作台的備份檔','bad')}};fr.readAsText(i.files[0]);return}
  if(!d.f)return;const p=P(d.p);if(!p)return;const s=d.s&&p.stages.find(x=>x.id===d.s);
  if(d.f==='stageName'){s.name=i.value.trim()||'未命名';i.value=s.name}
  else if(d.f==='todoText'){const t=s.todos.find(x=>x.id===d.t);if(!i.value.trim()){i.value=t.text;return}t.text=i.value.trim()}
  else if(d.f==='notes'){p.notes=i.value}
  save();renderSide()});
document.addEventListener('input',e=>{if(e.target.id==='tok'){const c=$('#code');if(c)c.textContent=scriptCode(e.target.value.trim())}});
document.addEventListener('keydown',e=>{const i=e.target;
  if(e.key==='Enter'&&i.dataset&&i.dataset.add&&!e.isComposing){const v=i.value.trim();if(!v)return;const p=P(i.dataset.p),s=p.stages.find(x=>x.id===i.dataset.add);s.todos.push(T(v));save();render();const n=document.querySelector(`[data-add="${s.id}"]`);n&&n.focus()}
  else if(e.key==='Enter'&&i.classList&&i.classList.contains('inl')&&!e.isComposing)i.blur()});

/* ---- sync（Google Apps Script，後寫的蓋掉先寫的） ---- */
async function api(body){const r=await fetch(CFG.url,{method:'POST',body:JSON.stringify(Object.assign({token:CFG.token},body))});const j=await r.json();if(!j.ok)throw new Error(j.error||'sync error');return j}
function setSync(st){syncState=st;if(st==='ok')syncAt=Date.now();renderSide();const t=$('#synclab');if(t)t.textContent=syncLabel()}
async function push(){if(!CFG.url)return;setSync('busy');try{await api({action:'set',data:S});setSync('ok')}catch(e){setSync('bad')}}
async function pull(loud){if(!CFG.url)return;setSync('busy');
  try{const j=await api({action:'get'});
    if(j.data&&j.updatedAt>S.updatedAt){S=j.data;S.projects.forEach(p=>{if(!p.icon)p.icon='star'});persist();setSync('ok');render();loud&&toast('已載入雲端上較新的資料')}
    else if(S.updatedAt>(j.updatedAt||0)||!j.data){await api({action:'set',data:S});setSync('ok');if(loud){render();toast('同步完成')}}
    else{setSync('ok');if(loud){render();toast('同步完成')}}
  }catch(e){setSync('bad');if(loud){render();toast(e.message==='unauthorized'?'同步密碼和腳本裡的不一樣':'連不上同步網址，請檢查部署設定','bad')}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});

render();pull();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
